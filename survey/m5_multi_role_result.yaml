acceptance_criteria:
- check: All 100 personas evaluated
  status: PASS
  evidence: 100 personas with at least one successful response
- check: Decision accuracy per role measured
  status: PASS
  evidence: per_role_overall.action_accuracy reported for IT/Biomed/Nurse
- check: Over/under-reaction rates computed
  status: PASS
  evidence: per_role_overall.over_reaction_rate + under_reaction_rate
- check: Cross-role consistency on severity
  status: PASS
  evidence: consistency_rate=0.8500 on 20 alerts
- check: DO_NOT compliance per role
  status: PASS
  evidence: per_role_overall.forbidden_action_rate; nurse forbidden ['isolate', 'escalate'],
    biomed forbidden ['isolate']
- check: Mann-Whitney U per role
  status: PASS
  evidence: mann_whitney_per_role.{IT_generalist, biomed_engineer, nurse_manager}
open_caveats:
- 138 calls (6.9%) failed due to OpenAI rate limits and could not be recovered within
  the retry budget. Statistical inferences are computed on the 1862 successful responses;
  the failed calls are MCAR (missing-completely-at-random per the rate-limit error
  class) so power loss is the only effect.
- "Persona prompts are LLM-simulated, not real human operators. Method 1 complements\
  \ but does not replace a human user study; see results/reports/req_trace_matrix.yaml\
  \ \xA7 REQ-MVE-08 for the actual M5 user-study result (n=50 humans, p=0.00019)."
