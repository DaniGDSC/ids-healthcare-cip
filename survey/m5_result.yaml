  interpretation: >
    MVE enrichment produced a 60.8% relative improvement in composite triage accuracy (Group A: 35.2%, Group B: 56.6%), well above the 30% pass threshold, with strong statistical significance (z=6.79, p=1.12e-11, Cohen's h=0.433). The largest gain was in 'anomalous_outbound_connection' (A=34.0% → B=74.0%, +118% relative), where clinical device context in the MVE allowed participants to correctly identify critical IoMT and outbound anomalies. The weakest improvement was in 'lateral_movement' (A=50.0% → B=68.0%, +36% relative), suggesting these alert categories remain challenging even with MVE. Under-reaction errors (severity underestimated by ≥2 levels) decreased from 12.2% to 5.8% with MVE, while over-reaction errors decreased from 8.2% to 1.0%, indicating MVE improved calibration in both directions.
