# ── 3. Risk-adaptive gate implementation ────────────────────────────────

risk_adaptive_gate:
  implementation_file: src/risk_scorer.py
  base_threshold: 0.50
  multiplier_table:
    description: "Per-(device_class, patchable) override applied AFTER (criticality, patchable) lookup. Closes GAP-A1."
    source_in_code: src/risk_scorer.py::_THRESHOLD_MULT_BY_DEVICE
    values:
      infusion_pump_unpatchable:   0.70    # threshold = 0.50 * 0.70 = 0.35
      infusion_pump_patchable:     0.85
      ventilator_unpatchable:      0.70
      ventilator_patchable:        0.85
      patient_monitor_unpatchable: 0.75
      patient_monitor_patchable:   0.90
      ehr_workstation_unpatchable: 0.80
      ehr_workstation_patchable:   0.95
      unknown_device_fallback:     0.80    # _UNKNOWN_DEVICE_FALLBACK_MULT
  similar_events_adjustment:
    condition: "event_context.similar_events_past_30d > 5"
    adjustment: "risk_multiplier = max(0.5, risk_multiplier - 0.20)"
    rationale: "Frequently-seen alert patterns reduce alert fatigue; floor 0.5 prevents over-suppression."
  safety_floor:
    condition: "device_criticality == CRITICAL AND patchable == False"
    action: "should_surface = True (always, regardless of R or threshold)"
    enforcement_paths:
      - src/risk_scorer.py:155-156 (normal code path)
      - src/risk_scorer.py:125-128 (maintenance-window early-return path)
    maintenance_window_handling: SUPPRESSES_DISPLAY_NOT_DETECTION
    test_coverage:
      - tests/test_safe_failure.py::test_critical_unpatchable_surfaces_in_maintenance_window  # ST-09
      - tests/test_safe_failure.py::test_low_patchable_suppressed_in_maintenance_window
      - tests/test_safe_failure.py::test_non_patchable_priority

# ── 4. Static vs adaptive comparison on holdout ─────────────────────────

static_vs_adaptive_comparison:
  on_holdout_set:
    holdout_n: 1469
    n_attacks: 185
    n_benign: 1284
    n_critical_attacks: 16
    auc_R_score: 0.9821                     # Excellent classifier; see ROC

  static_threshold_05:
    description: "Surface iff R >= 0.50 — single global threshold."
    tp: 167
    fn: 18
    fp: 32
    tn: 1252
    fnr_critical: 0.0000
    fnr_overall: 0.0973
    fpr_overall: 0.0249
    critical_alert_rate: 0.0804
    n_crit_caught: 16
    operating_point_on_roc: [0.0249, 0.9027]

  static_threshold_07:
    description: "Surface iff R >= 0.70 — conservative single threshold."
    tp: 130
    fn: 55
    fp: 1
    tn: 1283
    fnr_critical: 0.0000
    fnr_overall: 0.2973
    fpr_overall: 0.0008
    critical_alert_rate: 0.1221
    n_crit_caught: 16
    operating_point_on_roc: [0.0008, 0.7027]

  adaptive_proposed:
    description: "Per-row src/risk_scorer.py decision: device_class + criticality + similar_events + safety floor."
    tp: 168
    fn: 17
    fp: 55
    tn: 1229
    fnr_critical: 0.0000
    fnr_overall: 0.0919
    fpr_overall: 0.0428
    critical_alert_rate: 0.0717
    n_crit_caught: 16
    operating_point_on_roc: [0.0428, 0.9081]

  improvement_metrics:
    delta_adaptive_vs_static_05:
      fnr_critical_reduction: 0.0000      # All three already at 0; no reduction possible
      fnr_overall_change:    -0.0054      # Adaptive catches 1 extra attack (167 → 168)
      fpr_change:            +0.0179      # Adaptive raises FPR by 1.79 pp (32 → 55 false positives)
      critical_alert_rate_change: -0.0087 # Adaptive surfaces slightly broader population
    delta_adaptive_vs_static_07:
      fnr_critical_reduction: 0.0000
      fnr_overall_change:    -0.2054      # Adaptive catches 38 more attacks (130 → 168)
      fpr_change:            +0.0420      # Adaptive raises FPR by 4.2 pp (1 → 55)
      critical_alert_rate_change: -0.0504

  figure: results/figures/threshold_comparison_roc.png

  interpretation:
    when_adaptive_beats_static:
      - "Adaptive catches 1 attack that static-0.50 misses (TP 168 vs 167; FNR_overall 0.092 vs 0.097)."
      - "Adaptive catches 38 attacks that static-0.70 misses; static-0.70 sacrifices 20pp recall to gain trivial FPR reduction."
      - "Adaptive's per-device thresholds (CRITICAL+unpatchable → 0.35) detect weak signals on life-sustaining devices that static-0.50 would suppress (covered by ST-09 + safety-floor tests)."
    when_adaptive_matches_static:
      - "FNR_CRITICAL is 0.000 across all three strategies on this holdout. The R-formula's 0.80 boundary for CRITICAL tier is so far above static thresholds (0.50 / 0.70) that all three trivially catch every CRITICAL attack."
      - "On non-clinical devices (LOW criticality, patchable), adaptive's multiplier = 1.0 → identical to static-0.50."
    when_adaptive_could_be_tuned_better:
      - "Adaptive's FPR (0.0428) is 1.8pp higher than static-0.50 — entirely from the per-device threshold reductions on CRITICAL+unpatchable devices. Tuning options: raise the CRITICAL+unpatchable multiplier from 0.70 to 0.75 (would save ~10 false positives at small recall cost), OR keep current settings and accept the trade for safety-floor coverage."
      - "Static-0.70 dominates adaptive on FPR but loses 20pp recall — not a viable production setting."

