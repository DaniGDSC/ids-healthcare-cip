# ── 6. Safety-floor verification ────────────────────────────────────────

safety_floor_verification:
  invariant: "INVARIANT 2 — CRITICAL+unpatchable always surfaces"
  test_runner: tests/test_safe_failure.py

  test_cases:
    ST-09_maintenance_window_path:
      test_name: test_critical_unpatchable_surfaces_in_maintenance_window
      input:
        anomaly_score: 0.40
        device_context: {criticality: CRITICAL, patchable: false}
        event_context: {is_maintenance_window: true, is_known_vendor_ip: true}
      expected: should_surface = True (safety floor overrides maintenance suppression)
      actual: PASS

    LOW_patchable_suppression_preserved:
      test_name: test_low_patchable_suppressed_in_maintenance_window
      input:
        anomaly_score: 0.30
        device_context: {criticality: LOW, patchable: true}
        event_context: {is_maintenance_window: true, is_known_vendor_ip: true}
      expected: should_surface = False (suppression still works for non-critical devices)
      actual: PASS

    non_patchable_priority:
      test_name: test_non_patchable_priority
      input:
        anomaly_score: 0.50
        device_context: {criticality: HIGH, patchable: false}
      expected: risk_multiplier > 1.0 (elevated priority for unpatchable HIGH devices)
      actual: PASS

  edge_cases:
    boundary_R_exactly_0_80:
      description: "R = 0.80 exactly — should classify as CRITICAL tier (>= boundary)"
      verified: true
      implementation: "module3_risk_scoring/module3_risk_scores.py::assign_risk_levels uses >= comparator"

    unknown_device_class:
      description: "device_class not in ROLE_FORBIDDEN_ACTION_TERMS table"
      behaviour: "Falls back to _UNKNOWN_DEVICE_FALLBACK_MULT = 0.80 (conservative)"
      test: tests/test_safe_failure.py::test_device_class_unknown_falls_back_to_conservative
      status: PASS

    missing_patchable_info:
      description: "device_context missing 'patchable' key"
      behaviour: "src/risk_scorer.py:111 defaults to patchable=True (safe — assumes patchable)"
      test: tests/test_safe_failure.py::test_missing_device_context_defaults_safe
      status: PASS

