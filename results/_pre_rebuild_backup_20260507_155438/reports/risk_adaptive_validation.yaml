# ── 9. Open follow-ups ──────────────────────────────────────────────────

open_gaps:
  GAP-RAV-1: |
    Adaptive raises FPR by 1.79pp vs static-0.50 — entirely from
    per-device threshold reductions on CRITICAL+unpatchable. Raising
    the multiplier from 0.70 to 0.75 would save ~10 FPs at trivial
    recall cost. Hold pending operator-fatigue field data (RQ4).
  GAP-RAV-2: |
    EHR workstation FNR is 26% under all three strategies — the cap is
    Track A's coverage on this device class, not a gate-tuning problem.
    Closure depends on GAP-PB-5 (synthesise unauthorized_access samples
    so XGBoost has labelled examples) and possibly Track B retraining
    with EHR-workstation-aware weights.
  GAP-RAV-3: |
    Calibration set was used to verify split sizes only — no separate
    threshold-tuning sweep was run on calibration before measuring on
    holdout. Ideally, we'd grid-search the per-device multipliers on
    calibration before applying to holdout. Current numbers are
    descriptive (the spec defaults from src/risk_scorer.py work without
    calibration tuning) but a formal calibration sweep would harden the
    deliverable.
