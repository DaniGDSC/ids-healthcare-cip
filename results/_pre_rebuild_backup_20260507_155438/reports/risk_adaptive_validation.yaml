    infusion_pump:   {surfaced: 37, total: 184, rate: 0.2011}
    ventilator:      {surfaced: 48, total: 208, rate: 0.2308}
    patient_monitor: {surfaced: 49, total: 284, rate: 0.1725}
    note: |
      Surfacing rate ≈ 17–23% on critical-device classes corresponds to:
        (true attacks on these devices: 21+38+39 = 98) +
        (false positives from threshold reduction)
      = 134/676 = 19.8% — close to the per-class rates above.
