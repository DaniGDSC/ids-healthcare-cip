# detection_baseline.yaml
# RQ1.a — Track A detection baseline (XGBoost / RF / DT)
# Covers ARCHITECTURE.md workflow steps [2] Track A Training and [6a] Track A inference.
#
# All numerical values were extracted from the JSON artifacts listed under
# `source_artifacts` below. No values were hand-typed from logs.
#
# Generated: 2026-05-05
# Branch: fix/shap-category-vocab

source_artifacts:
  - results/models/xgboost_final_report.json
  - results/models/random_forest_final_report.json
  - results/models/decision_tree_final_report.json
  - results/reports/test_evaluation_report.json
  - results/reports/risk_report.json   # dual_track_fusion.quadrants for per-category FNR

deliverable_metadata:
  rq: "RQ1.a — Track A (supervised) detection performance baseline"
  workflow_steps_covered: ["[2] Track A Training", "[6a] Track A inference"]
  selected_model: XGBoost
  rationale: "Dominant on F1 (0.892), F2 (0.919), and ROC AUC (0.994); all three exceed the next-best classifier (Random Forest) by >0.04 absolute on every headline metric."

# ── 1. Test set specification ───────────────────────────────────────────

test_set:
  source: WUSTL-EHMS-2020 test split
  size: 4896
  benign_count: 4282
  attack_count: 614
  benign_pct: 87.46
  attack_pct: 12.54
  attack_categories:
    Data_Alteration: 277
    Spoofing: 337
  limitations:
    - "ONLY 2 of the 5 designed attack categories are present in the WUSTL test split."
    - "Missing categories: lateral_movement, data_exfiltration, unauthorized_access (zero samples)."
    - "Per-category FNR/FPR for the missing categories is therefore undefined; tracked as GAP-PB-5 in Performance_baselines.md."
    - "The 25-feature schema does not carry device_class at the row level, so per-device-class metrics are blocked (GAP-PB-1)."

