  - check: "All 6 test cases PASS"
    status: PASS
    evidence: "tests/test_two_stage_fusion.py — 6 named + 3 invariant = 9/9 passed."
  - check: "Calibration done on stratified set"
    status: PASS
    evidence: "Grid search on results/reports/stratified_calibration.parquet (3427 rows, seed=42, GAP-A7-closure schema with row_id and severity_tier columns)."
  - check: "Holdout metrics reported"
