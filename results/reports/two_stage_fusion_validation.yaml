# ── 7. Reproducibility ──────────────────────────────────────────────────

reproducibility:
  prerequisites:
    - "GAP-A7 closure: row_id + severity_tier columns on test_phase1.parquet"
    - "GAP-A10 closure: DAE retrained at seed=42"
    - "Stratified split materialised: python module6_evaluation/build_stratified_eval_set.py"
  recompute: |
    1. python module2_detection/module2_train_models.py --seed 42
    2. python module3_risk_scoring/module3_risk_scores.py
    3. python module6_evaluation/build_stratified_eval_set.py
    4. (re-run the calibration block embedded in this commit's compute cache)
  test_runner: "python -m pytest tests/test_two_stage_fusion.py -v"

# ── 8. Open follow-ups ──────────────────────────────────────────────────

open_gaps:
  GAP-TS-1: |
    NOVEL_ANOMALY precision 0.0208 on this holdout — by design (Track A
    disagrees with DAE), but this means 47/48 NOVEL alerts are FPs that
    waste L2 specialist time. Consider raising `b` further (DAE >= 0.90)
    or requiring corroborating signal before tier-routing to L2.
  GAP-TS-2: |
    Calibration selected divergent thresholds (0.95/0.05/0.80 vs spec
    0.85/0.40/0.70). Decide whether to update ARCHITECTURE.md spec to
    match the calibrated values OR pin code to spec values and document
    the cost (higher FPR, fewer KNOWN routes).
  GAP-TS-3: |
    Per-attack-category breakdown of two-stage vs max (which fusion
    catches Spoofing better? Data Alteration?) — extend §3 with
    per-category Wilson CIs after GAP-PB-5 augments the test set.
