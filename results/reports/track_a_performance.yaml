    full_test_size: 4896
    benign_count: 4282
    attack_count: 614
    benign_pct: 87.46
    attack_pct: 12.54
    stratification: "by composite-risk severity tier (CRITICAL / HIGH / MEDIUM / LOW)"
    random_seed: 42
    seed_source: "RANDOM_STATE in module2_detection/module2_train_models.py"
    full_test_per_tier_counts:
      CRITICAL: 48
      HIGH:     553
      MEDIUM:   140
      LOW:      4155

    calibration_split:
      ratio: 0.70
      computed_sizes_per_tier:
        CRITICAL: 34
        HIGH:     387
        MEDIUM:   98
        LOW:      2908
      total: 3427

    holdout_split:
      ratio: 0.30
      computed_sizes_per_tier:
        CRITICAL: 14
        HIGH:     166
        MEDIUM:   42
        LOW:      1247
      total: 1469

    PREREQUISITE_GAP_PB_1:
      status: CLOSED
      closed_capabilities:
        - "Materialised calibration/holdout parquet files via module6_evaluation/build_stratified_eval_set.py"
        - "results/reports/stratified_calibration.parquet (3427 rows; per-tier {CRITICAL: 34, HIGH: 387, MEDIUM: 98, LOW: 2908})"
        - "results/reports/stratified_holdout.parquet (1469 rows; per-tier {CRITICAL: 14, HIGH: 166, MEDIUM: 42, LOW: 1247})"
        - "results/reports/stratified_split_summary.yaml (provenance + seed)"
        - "GAP-A7 closed 2026-05-05: device_class column written by Module 1 (common.device_class.derive_device_class_array) at row level of test_phase1.parquet, train_phase1.parquet, train_benign_phase1.parquet"
        - "module6_evaluation.compute_per_device_metrics now uses the parquet column as authoritative source"
      remaining_caveat: |
        device_class is derived from a biometric-feature heuristic
        (common.device_class). Replacing it with an authoritative
        IP/MAC → inventory join is a future Module 0 enhancement; the
        column is currently shared between Module 1's exporter and Module
