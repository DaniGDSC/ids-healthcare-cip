    accuracy: 0.9716
    precision_attack: 0.8508
    recall_attack: 0.9381
    f1_attack: 0.8923
    f2_attack: 0.9192
    fpr: 0.0236
    fnr: 0.0619
    roc_auc: 0.9941
    confusion_matrix: {tp: 576, fn: 38, fp: 101, tn: 4181}

  random_forest:
    threshold: 0.4887
    accuracy: 0.9504
    precision_attack: 0.8076
    recall_attack: 0.7932
    f1_attack: 0.8003
    f2_attack: 0.7960
    fpr: 0.0271
    fnr: 0.2068
    roc_auc: 0.9589
    confusion_matrix: {tp: 487, fn: 127, fp: 116, tn: 4166}

  decision_tree:
    threshold: 0.3349
    accuracy: 0.9097
    precision_attack: 0.6014
    recall_attack: 0.8306
    f1_attack: 0.6977
    f2_attack: 0.7718
    fpr: 0.0789
    fnr: 0.1694
    roc_auc: 0.8911
    confusion_matrix: {tp: 510, fn: 104, fp: 338, tn: 3944}

  selection_rationale:
    - "XGBoost dominates on F1 (0.892 vs 0.800 RF, 0.698 DT)."
    - "XGBoost dominates on F2 (0.919 vs 0.796 RF, 0.772 DT) — F2 weights recall, the more clinically dangerous direction."
    - "XGBoost dominates on ROC AUC (0.994 vs 0.959 RF, 0.891 DT)."
    - "Lowest FNR (0.062 vs 0.207 RF, 0.169 DT) — FN is the clinically costly miss."
    - "RF and DT retained as Track A reference models; their probabilities feed the cascaded DAE input [raw || P_xgb, P_rf, P_dt]."
  ensemble_evaluation:
    decision: skipped
    reason: "XGBoost dominates RF and DT on every headline metric. Manual inspection of risk_report.dual_track_fusion.quadrants.only_xgboost shows 432 of 533 XGBoost-only flags are true attacks that RF and DT both miss — confirming primary-model selection."

# ── 3. Per-attack-category performance ──────────────────────────────────

per_attack_category_performance:
  source: "results/reports/risk_report.json — dual_track_fusion.quadrants"
  computation: |
    For each category C: total = attacks of class C; flagged = both_flag[C] + only_xgboost[C];
    missed = neither[C]; FNR = missed / total. CI = Wilson 95% on (missed, total).
  xgboost:
    Data_Alteration:
      total: 277
      flagged: 277
      missed: 0
      fnr: 0.0000
      fnr_95_ci_wilson: [0.0000, 0.0137]
    Spoofing:
      total: 337
      flagged: 299
      missed: 38
      fnr: 0.1128
      fnr_95_ci_wilson: [0.0833, 0.1510]
    Lateral_movement:
      status: NOT_PRESENT_IN_DATASET
      gap: GAP-PB-5
    Data_exfiltration:
      status: NOT_PRESENT_IN_DATASET
      gap: GAP-PB-5
    Unauthorized_access:
      status: NOT_PRESENT_IN_DATASET
      gap: GAP-PB-5
  observation: |
    Spoofing is the residual blind spot for Track A — XGBoost misses 11.3% of spoofing
    attacks while flagging 100% of Data Alteration. This is the precise gap the cascaded
    DAE (Track B) is designed to backstop: spoofed flows that look superficially benign
    in raw features still generate elevated reconstruction error in the joint
    [raw || P_xgb, P_rf, P_dt] space.

