      true_critical_count: 15
      critical_alert_rate: 0.6667
      fnr_critical: 0.0000
      sensitivity: 1.0000
      specificity: 0.5000
      confusion_matrix: {tp: 16, fn: 0, fp: 2, tn: 2}

  limitations:
    - "Only 2 of 5 designed attack categories present (Spoofing, Data Alteration); the other 3 (lateral_movement, data_exfiltration, unauthorized_access) have ZERO samples."
    - "CRITICAL holdout n=14 — far below the P0.4 minimum of 200/stratum (GAP-PB-4)."
    - "Row-level severity + device-class fields not yet exported from Module 1, blocking the materialised stratified partition files (GAP-PB-1)."

# ── 2. Comparative evaluation (3 supervised Track A models) ─────────────

