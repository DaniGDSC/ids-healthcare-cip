# track_a_performance.yaml
# Step [6a] Track A inference baseline (XGBoost / RF / DT)
# Covers ARCHITECTURE.md workflow Step [6a] in depth.
#
# This deliverable supersedes the simpler results/reports/detection_baseline.yaml
# by adding: stratified-split sizing, per-tier holdout CIs, prerequisite-gap
# annotations, and reproducibility verification.
#
# All numerical values were extracted from the JSON artifacts named under
# `source_artifacts`. No values were hand-typed.
#
# Generated: 2026-05-05  Branch: fix/shap-category-vocab

source_artifacts:
  - results/models/xgboost_final_report.json
  - results/models/random_forest_final_report.json
  - results/models/decision_tree_final_report.json
  - results/reports/test_evaluation_report.json
  - results/reports/risk_report.json   # for per-category quadrant table
  - results/rq2_metrics.json            # for the curated 20-alert stress set

deliverable_metadata:
  workflow_step: "[6a] Track A inference"
  selected_model: XGBoost
  rng_seed: 42
  rng_seed_location: "RANDOM_STATE constant in module2_detection/module2_train_models.py:51"

# ── 1. Test set specification ───────────────────────────────────────────

