  secondary_set_stress_test:
    source: "results/reports/evaluation_alerts.json (curated 20-alert set)"
    role: "pathological-case stress test only — NOT used for tuning"
    used_for_tuning: false
    metrics_artifact: results/rq2_metrics.json
