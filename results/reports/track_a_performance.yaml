# ── 5. Confidence intervals ─────────────────────────────────────────────

confidence_intervals:
  method: "Wilson score interval (better for small N than normal approximation)"
  z: 1.96   # 95% confidence

  per_model_overall_fnr_ci:
    note: "FNR computed over all 614 test-set attacks."
    xgboost:        {n: 614, fnr: 0.0619, ci_low: 0.0454, ci_high: 0.0838}
    random_forest:  {n: 614, fnr: 0.2068, ci_low: 0.1768, ci_high: 0.2403}
    decision_tree:  {n: 614, fnr: 0.1694, ci_low: 0.1422, ci_high: 0.2007}

  fnr_critical_on_holdout:
    description: "Wilson 95% CI on FNR projected onto the 30%-holdout CRITICAL stratum."
    point_estimate: 0.0619     # overall XGBoost FNR (no per-tier predictions yet)
    sample_size: 14
    ci_low: 0.0099
    ci_high: 0.3025
    half_width: 0.1463
    SMALL_SAMPLE_WARNING: |
      N=14 is FAR below the spec warning threshold (N<50) and the P0.4 minimum
      (200/stratum). The Wilson 95% CI half-width (0.1463) is more than 2x the
      point estimate. The CI upper bound 0.30 is essentially uninformative
      (it permits any FNR up to 30%). Recompute with a stratified holdout of
      ≥200 CRITICAL alerts after GAP-PB-4 is closed.

  fnr_critical_on_full_critical_stratum:
    description: "Same FNR projected onto the entire CRITICAL tier (n=48), for reference."
    point_estimate: 0.0619
    sample_size: 48
    ci_low: 0.0212
    ci_high: 0.1675
    half_width: 0.0732
    note: "Half-width still wider than the point estimate; small-sample caveat applies."

# ── 6. Reproducibility ──────────────────────────────────────────────────

reproducibility:
  command_in_spec: "python module2_detection/module2_train_models.py --seed 42"
  status: PASS
  actual_command: "python module2_detection/module2_train_models.py --seed 42"
  rng_seed_handling: |
    Closed by Fix 1 of the M2-closure plan. argparse `--seed` flag added at
    module2_detection/module2_train_models.py::main (default 42); the parsed
    seed overwrites RANDOM_STATE module-level constant before any model is
    instantiated, threading deterministically into every classifier's
    random_state, StratifiedKFold, SMOTE, and DAE init. The seed is also
    persisted into every *_final_report.json under data.random_seed so
    downstream consumers can verify what seed produced the artefacts.
  closes_gap: GAP-RP-1
  reproducibility_chain:
    - "1. python module1_preprocessing/phase1   → train_phase1.parquet, test_phase1.parquet, train_benign_phase1.parquet"
    - "2. python module2_detection/module2_train_models.py   → results/models/xgboost_final_pipeline.pkl + xgboost_final_report.json (and RF/DT/DAE artefacts)"
    - "3. python module3_risk_scoring/module3_risk_scores.py   → results/reports/risk_report.json + risk_scores.npz"
    - "4. python -c 'see embedded helper'     → recompute Wilson CIs in this YAML"
  primary_artifact: results/models/xgboost_final_report.json
  embedded_wilson_helper: |
    def wilson(p_hat, n, z=1.96):
        if n == 0: return (0.0, 0.0)
        denom = 1 + z*z/n
        centre = (p_hat + z*z/(2*n)) / denom
        half = z * ((p_hat*(1-p_hat) + z*z/(4*n)) / n) ** 0.5 / denom
        return (max(0.0, centre - half), min(1.0, centre + half))

