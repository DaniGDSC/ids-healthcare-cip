ablation:
  dataset: EHMS-2020
  fold_protocol: leave-one-class-out
  experiment_purity: A
  n_folds: 2
  seed: 42
  sample_cap: null
  wall_time_seconds: 35.9
  configs:
  - name: DAE-raw
    input_dim: 27
    input_features: 27 raw network features
  - name: DAE-cascade
    input_dim: 28
    input_features: 27 raw || P_xgb_val (v5 contract)
  - name: DAE-probas-only
    input_dim: 1
    input_features: P_xgb_val
    note: 1-D DAE is degenerate (bottleneck must be < n_features); we substitute |z-score|
      vs benign mean as recon-error proxy.
  caveats:
  - EHMS-2020 has 2 attack classes; N=2 folds.
  - XGB uses fixed default hyperparameters per fold (no RandomizedSearchCV) to keep
    ablation runtime bounded.
  - DAE-probas-only is a 1-D z-score baseline, not a true autoencoder.
