summary:
  ranking_by_mean_auc:
  - config: DAE-raw
    mean_auc: 0.7727300460293225
    delta_vs_raw: 0.0
  - config: DAE-cascade
    mean_auc: 0.7624442754885741
    delta_vs_raw: -0.010285770540748418
  - config: DAE-probas-only
    mean_auc: 0.6084193433671432
    delta_vs_raw: -0.1643107026621793
  best_per_fold:
    Data Alteration: DAE-raw
    Spoofing: DAE-raw
  cascade_vs_raw_mean_auc_delta: -0.010285770540748418
  cascade_vs_raw_verdict: REGRESSION
  per_fold_interpretation:
  - On 'Data Alteration' the raw 25-dim DAE already separates novel-from-benign at
    AUC=0.996; the cascade adds nothing measurable here.
  - "On 'Spoofing' a benign-only DAE collapses to AUC=0.549 (near random); the cascade\
    \ does not rescue it. The unsupervised path cannot detect this attack class \u2014\
    \ Track A (a supervised classifier that has seen this class) is required."
  conclusion: "Cascade input (raw + P_xgb) vs raw alone: mean \u0394 AUC = -0.0103\
    \ (REGRESSION). DAE-probas-only is a 1-D z-score baseline and is reported only\
    \ to show what falls out without raw features."
