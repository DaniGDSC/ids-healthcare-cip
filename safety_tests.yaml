safety_tests:
  scope: "Safe failure mode tests for IoMT IDS system"
  analysis_date: "2026-04-13"
  methodology: >
    Each edge case probed against current src/mve_generator.py and
    src/risk_scorer.py. Current behavior documented alongside expected
    safe behavior. Gap = current behavior differs from safe expectation.

  test_cases:

    - id: "ST-01"
      name: "Unknown device defaults to CRITICAL"
      description: "When an alert arrives from an IP not in the device inventory, the system must assume worst-case criticality. Unknown devices in a clinical network could be anything — including a ventilator that was recently moved or a rogue device attached to the clinical VLAN."
      input_condition: "device_context.device_type = 'unknown', device_context.criticality = 'LOW' (default), baseline empty"
      expected_safe_output:
        severity: "CRITICAL"
        layer_1_confidence: "MEDIUM — device not in asset inventory, cannot establish baseline"
        layer_3_action_contains: "Do not interact with device until identified"
        layer_3_escalation_contains: "Biomed Engineering"
        layer_3_must_not_contain: "No immediate disruption required"
      unsafe_output_definition: "severity = LOW, action = 'Log and monitor', no biomed in escalation"
      patient_safety_risk_if_unsafe: "An unidentified compromised ventilator or infusion pump receives LOW severity and 24-hour response window. Attacker has extended dwell time on a potentially life-sustaining device."
      current_behavior:
        severity: "LOW"
        action: "Log connection and apply outbound traffic monitoring. No immediate disruption required."
        gap: "UNSAFE — unknown device gets minimum severity instead of maximum"
      test_type: "unit"
      iomt_specific: true

    - id: "ST-02"
      name: "Asset inventory unavailable defaults to CRITICAL"
      description: "When the device database is unreachable (connection error, timeout, corrupt data), the system must not silently fall back to default LOW severity. Empty device_context should trigger CRITICAL-by-default."
      input_condition: "device_context = {} (empty dict — simulating DB connection failure)"
      expected_safe_output:
        severity: "CRITICAL"
        layer_1_confidence: "LOW — device context unavailable, treating as highest risk"
        layer_1_baseline_contains: "Device context unavailable"
        layer_3_action_contains: "Escalate to security lead and Biomed Engineering immediately"
        layer_3_must_not_contain: "No immediate disruption required"
      unsafe_output_definition: "System uses empty defaults (LOW severity), generates meaningless narrative without flagging data absence"
      patient_safety_risk_if_unsafe: "All alerts during inventory outage are LOW severity. A genuine CRITICAL event on a ventilator is missed because the system doesn't know it's a ventilator."
      current_behavior:
        severity: "LOW"
        action: "Generates normally with empty strings — 'device () normally communicates with...'"
        gap: "UNSAFE — empty device_context produces LOW severity with no warning about data absence"
      test_type: "unit"
      iomt_specific: false

    - id: "ST-03"
      name: "Conflicting severity signals resolve to higher"
      description: "When the DAE reconstruction error is below threshold (suggesting normal) but the device is CRITICAL+unpatchable, the risk engine must ensure the alert surfaces. The device criticality is a safety-driven override — a CRITICAL unpatchable device with even a small anomaly signal must be investigated."
      input_condition: "anomaly_score = 0.2, device_criticality = CRITICAL, patchable = False"
      expected_safe_output:
        should_surface: true
        severity: "CRITICAL or HIGH"
        layer_1_confidence: "MEDIUM — anomaly signal is weak but device criticality requires investigation"
        layer_3_action_contains: "verify with biomed"
      unsafe_output_definition: "should_surface = False — the alert is suppressed entirely for a CRITICAL unpatchable device"
      patient_safety_risk_if_unsafe: "A CRITICAL unpatchable infusion pump with a subtle anomaly (possibly early-stage compromise) is silenced. The IDS is the ONLY compensating control for unpatchable devices, and it fails to surface the alert."
      current_behavior:
        adjusted_score: 0.3
        threshold: 0.35
        should_surface: false
        gap: "UNSAFE — anomaly_score=0.2 on CRITICAL+unpatchable device is suppressed (0.3 < 0.35). The risk multiplier (1.5x) is insufficient to push a weak signal above the lowered threshold (0.7x default). The compensating control has a blind spot for subtle anomalies."
      test_type: "unit"
      iomt_specific: true

    - id: "ST-04"
      name: "Near-zero SHAP triggers low-confidence explanation"
      description: "When no feature has meaningful SHAP attribution (all |SHAP| < 0.05), the model is uncertain about WHY the alert fired. The explanation should acknowledge this uncertainty rather than generating a confident-sounding narrative from noise."
      input_condition: "All 25 SHAP values have |value| < 0.05"
      expected_safe_output:
        layer_1_confidence: "LOW — insufficient feature attribution, explanation may be unreliable"
        layer_1_deviation_contains: "Model detected anomaly but could not identify a dominant contributing factor"
        layer_3_action_contains: "Investigate manually — automated explanation inconclusive"
      unsafe_output_definition: "System generates HIGH confidence narrative based on the largest near-zero SHAP value, presenting noise as signal"
      patient_safety_risk_if_unsafe: "Operator acts on a confidently-presented but unreliable explanation. For an IoMT device, this could mean applying the wrong network control (blocking a protocol the device actually needs) based on a SHAP attribution that is essentially random."
      current_behavior:
        n_affected_samples: "0/4896 (no test samples have all |SHAP| < 0.05)"
        gap: "NOT OBSERVED in current test data — the XGBoost model always produces at least one feature with |SHAP| > 0.05. However, no guardrail exists in code. If a future model version or edge-case input produced near-zero SHAP, the system would generate a confident narrative from noise."
      test_type: "unit"
      iomt_specific: false

    - id: "ST-05"
      name: "Action generation failure produces safe fallback"
      description: "When Layer 3 action generation fails (template error, invalid criticality value, exception), the system must produce a safe conservative fallback rather than returning empty output or crashing."
      input_condition: "CRITICAL alert with device_context.criticality = 'INVALID' (not in enum)"
      expected_safe_output:
        severity: "CRITICAL (or highest available)"
        layer_3_action_contains: "Escalate to security lead and Biomed Engineering immediately. Do not interact with device."
        layer_3_constraint_contains: "DO NOT take any automated action"
      unsafe_output_definition: "System returns empty Layer 3, crashes, or produces severity='INVALID' (not in the clinical enum)"
      patient_safety_risk_if_unsafe: "A CRITICAL alert with no action guidance. Operator has no recommendation and no safety constraint. Under time pressure, they may take the default IT action (full isolation) which could disrupt a life-sustaining device."
      current_behavior:
        severity_label: "INVALID"
        exception: "None — system produces output with severity_label='INVALID'"
        gap: "UNSAFE — invalid criticality value passes through unchecked. severity_label='INVALID' is not in the clinical severity enum (CRITICAL/HIGH/MEDIUM/LOW) and has no defined response timeframe. Operator has no guidance on urgency."
      test_type: "unit"
      iomt_specific: false

    - id: "ST-06"
      name: "Life-sustaining device blocks physical isolation"
      description: "For ventilators and active infusion pumps, the immediate_action must NEVER contain words that suggest physical disconnection. The clinical_constraint must explicitly block physical device interaction."
      input_condition: "CRITICAL alert, device_class = ventilator or infusion_pump, any anomaly score"
      expected_safe_output:
        layer_3_action_must_not_contain: ["power off", "shutdown", "shut down", "unplug", "disconnect", "power cycle", "reboot"]
        layer_3_constraint_contains: "DO NOT power-cycle or disconnect"
        layer_3_action_type: "network-layer only (NAC, firewall, switch ACL, rate-limit)"
      unsafe_output_definition: "immediate_action contains any physical disconnection verb for an active life-sustaining device"
      patient_safety_risk_if_unsafe: "Operator follows the system recommendation and physically disconnects a ventilator. Patient loses respiratory support. This is the highest-severity safety failure the system can cause."
      current_behavior:
        critical_ventilator_action: "Apply NAC policy CLINICAL-QUARANTINE: block outbound non-HTTPS"
        critical_constraint: "DO NOT power-cycle or disconnect device during active clinical use"
        high_constraint: "DO NOT isolate device entirely — restrict suspicious outbound only"
        gap: "SAFE for CRITICAL (explicit DO NOT disconnect). PARTIAL for HIGH — constraint says 'DO NOT isolate device entirely' but does not explicitly block physical disconnection. The word 'isolate' is ambiguous."
      test_type: "unit"
      iomt_specific: true

    - id: "ST-07"
      name: "Short baseline triggers low confidence"
      description: "When a device has been enrolled for less than 7 days, the behavioral baseline is statistically insufficient. The system must not report HIGH confidence on a baseline that may not have observed the device's full behavioral range (weekly cycles, maintenance patterns)."
      input_condition: "device baseline_days < 7, any anomaly detected"
      expected_safe_output:
        layer_1_confidence: "LOW"
        layer_1_confidence_contains: "baseline period insufficient"
        layer_1_confidence_contains_days: true
      unsafe_output_definition: "confidence_indicator = HIGH with baseline_days < 7. The system presents 3 days of data as conclusive evidence."
      patient_safety_risk_if_unsafe: "False positive on a newly enrolled infusion pump. Operator sees HIGH confidence alert and isolates the pump. The 'anomaly' was actually a normal weekly behavior pattern the 3-day baseline hadn't seen. Drug delivery is interrupted for a false alarm that the system presented as high-confidence."
      current_behavior:
        baseline_0_days: "Confidence: HIGH — not observed in 0 days of baseline"
        baseline_3_days: "Confidence: HIGH — not observed in 3 days of baseline"
        baseline_7_days: "Confidence: HIGH — not observed in 7 days of baseline"
        gap: "UNSAFE — system reports HIGH confidence regardless of baseline duration. A 0-day baseline produces the same confidence as a 90-day baseline. The baseline_days value is included in the text but the HIGH label overrides the nuance."
      test_type: "unit"
      iomt_specific: true

    - id: "ST-08"
      name: "Maintenance window reduces confidence"
      description: "When a device has an active scheduled maintenance window AND the traffic destination is a known vendor IP, the system should suppress or heavily downgrade the alert. When maintenance is active but the destination is NOT a known vendor IP, the system should note the maintenance context but still surface the alert at reduced confidence."
      input_condition: "event_context.is_maintenance_window = True"
      expected_safe_output:
        maintenance_plus_vendor:
          should_surface: false
          suppression_reason: "contains 'maintenance'"
        maintenance_without_vendor:
          should_surface: true
          layer_1_confidence: "LOW"
          layer_1_confidence_contains: "scheduled maintenance window active"
      unsafe_output_definition: "HIGH confidence CRITICAL alert during scheduled vendor maintenance, triggering unnecessary clinical disruption (device isolation during firmware update could brick the device)"
      patient_safety_risk_if_unsafe: "Operator isolates an infusion pump during a legitimate firmware update. The partial update bricks the device — it cannot be restored without vendor service call. The pump is removed from service, reducing ICU capacity. If no replacement is available, a patient may have drug delivery interrupted."
      current_behavior:
        maintenance_plus_vendor: "should_surface=False, suppression_reason='known maintenance window with authorized vendor IP' — SAFE"
        maintenance_without_vendor: "should_surface=True, no confidence downgrade, no maintenance mention in Layer 1 — PARTIAL GAP"
        gap: "Maintenance+vendor suppression works correctly. But maintenance WITHOUT vendor IP (could be unauthorized access during maintenance window) surfaces as a normal alert with no mention of the maintenance context. The operator has no information that maintenance is scheduled."
      test_type: "integration"
      iomt_specific: true

  gap_summary:
    safe_by_design: ["ST-06 (CRITICAL)", "ST-08 (maintenance+vendor)"]
    partial_gaps: ["ST-04 (not observed but no guardrail)", "ST-06 (HIGH ambiguity)", "ST-08 (maintenance w/o vendor)"]
    unsafe_gaps:
      - id: "ST-01"
        severity: "HIGH"
        description: "Unknown device gets LOW instead of CRITICAL"
      - id: "ST-02"
        severity: "HIGH"
        description: "Empty device_context produces LOW with no warning"
      - id: "ST-03"
        severity: "CRITICAL"
        description: "CRITICAL+unpatchable device suppressed at anomaly_score=0.2"
      - id: "ST-05"
        severity: "HIGH"
        description: "Invalid criticality passes through — severity_label='INVALID'"
      - id: "ST-07"
        severity: "HIGH"
        description: "HIGH confidence on 0-day baseline"

  gate_3_blocking_tests: ["ST-01", "ST-02", "ST-03", "ST-05", "ST-06", "ST-07"]
  gate_3_blocking_rationale: >
      These 6 tests represent failure modes where the system actively provides
      misleading safety-critical information: wrong severity (ST-01, ST-02, ST-05),
      suppressed alerts on CRITICAL devices (ST-03), potential physical device
      disconnection (ST-06), or false confidence on insufficient data (ST-07).
      All must pass before the system can be deployed in a clinical environment.
      ST-04 and ST-08 are important but not gate-blocking because ST-04 does not
      occur in current test data and ST-08's maintenance+vendor path is already safe.

do_not_constraint_completeness:
  checked_against: "mve_specification.yaml (with IMP-01 through IMP-06 amendments)"
  analysis_date: "2026-04-13"
  methodology: >
    Generated Layer 3 output via src/mve_generator.py for each device class
    using realistic alert parameters. Compared implementation output against
    mve_specification.yaml requirements and IMP-03 action_level_clarification
    format. Checked: DO NOT presence, physical action prohibition, network
    action permission (SAFE statement), clinical coordination role, and
    IMP-03 format compliance.

  device_class_results:

    - device_class: "DC-01 — Infusion pump (active drug delivery)"
      spec_example: "DO NOT power-cycle pumps during active infusions — coordinate with ICU charge nurse first."
      implementation_output: "DO NOT isolate device from EHR gateway — vital sign reporting to nursing station must continue."
      do_not_present: true
      physical_action_prohibited: false
      physical_action_gap: "Spec says 'DO NOT power-cycle pumps.' Implementation says 'DO NOT isolate device from EHR gateway.' The T5 template does not explicitly prohibit physical disconnection — it prohibits network isolation from EHR, which is a different (and narrower) constraint."
      network_action_permitted: false
      network_action_gap: "No SAFE statement. Implementation says 'rate-limit abnormal traffic' in immediate_action but the constraint does not explicitly state that rate-limiting is safe. Operator must infer this."
      clinical_coordination_named: false
      coordination_gap: "Spec requires 'ICU charge nurse.' Implementation escalation is '(1) Biomed Engineering, (2) Security lead' — no charge nurse. The nurse managing the patient's infusion is not notified."
      imp03_format_compliant: false
      imp03_gap: "IMP-03 requires 'DO NOT [physical] — SAFE: [network action] — Contact [role].' Implementation uses pre-IMP-03 format: 'DO NOT [isolate from gateway]' with no SAFE clause."
      status: "PARTIAL"
      gap: "3 gaps: (1) physical disconnection not explicitly prohibited, (2) no SAFE network-action statement, (3) ICU charge nurse missing from escalation. Template uses generic T5 IoMT template rather than pump-specific constraint."

    - device_class: "DC-02 — Ventilator (active respiratory support)"
      spec_example: "DO NOT power off or physically disconnect ventilator — this interrupts patient breathing support. SAFE: Block port 23 at switch ACL — ventilator clinical operation uses port 443 and is unaffected."
      implementation_output: "DO NOT isolate device from EHR gateway — vital sign reporting to nursing station must continue."
      do_not_present: true
      physical_action_prohibited: false
      physical_action_gap: "Spec explicitly says 'DO NOT power off or physically disconnect ventilator.' Implementation says 'DO NOT isolate device from EHR gateway' — does not mention power-off or physical disconnection at all. A ventilator producing the same constraint as a patient monitor is a device-class differentiation failure."
      network_action_permitted: false
      network_action_gap: "Spec provides exact IMP-03 SAFE statement with port numbers. Implementation has none."
      clinical_coordination_named: true
      coordination_detail: "Biomed Engineering is in escalation path — correct per spec."
      imp03_format_compliant: false
      imp03_gap: "IMP-03 was specifically designed for this exact alert (ventilator Telnet, alert_18). The spec provides a complete IMP-03 example for ventilators but the rule-based template has not been updated to implement it."
      status: "PARTIAL"
      gap: "Critical gap: ventilator produces IDENTICAL output to infusion pump and patient monitor. The IMP-03 fix (designed for exactly this device class) is in the spec but not in the template. Physical disconnection prohibition is missing — the most dangerous action for a ventilator is not explicitly blocked."

    - device_class: "DC-03 — Patient monitor (active vital signs)"
      spec_example: "DO NOT isolate monitor from EHR gateway — vital sign reporting to nursing station must continue."
      implementation_output: "DO NOT isolate device from EHR gateway — vital sign reporting to nursing station must continue."
      do_not_present: true
      physical_action_prohibited: false
      physical_action_gap: "Monitor does not require physical action prohibition as strongly as ventilator/pump (monitors are not life-sustaining in the same sense). However, disconnecting a monitor removes alarm capability."
      network_action_permitted: true
      network_action_detail: "immediate_action says 'rate-limit abnormal traffic' — a specific safe network action. But this is in the action field, not framed as a SAFE statement in the constraint."
      clinical_coordination_named: true
      coordination_detail: "Biomed Engineering in escalation — correct per spec."
      imp03_format_compliant: false
      imp03_gap: "IMP-03 applies to CRITICAL/HIGH IoMT. Patient monitor at HIGH should have SAFE statement but does not."
      status: "PARTIAL"
      gap: "Closest to compliant. Main gap: no explicit SAFE statement distinguishing network action from physical action. The constraint correctly identifies what to preserve (vital sign reporting) but does not tell the operator what IS safe to do."

    - device_class: "DC-04 — Insulin pump (active drug delivery, mobile)"
      spec_requirement: "DO NOT RF jam or apply network-wide block. Note: RF-based insulin pumps are not detectable by network IDS."
      implementation_output: "DO NOT isolate device from EHR gateway — vital sign reporting to nursing station must continue."
      do_not_present: true
      physical_action_prohibited: false
      network_action_permitted: true
      network_action_detail: "rate-limit in immediate_action"
      clinical_coordination_named: true
      imp03_format_compliant: false
      status: "PARTIAL"
      gap: "Two issues: (1) constraint mentions 'vital sign reporting' which is not the primary function of an insulin pump (drug delivery is). Template is not device-class-aware. (2) RF-based insulin pumps (e.g., Medtronic MiniMed) communicate via proprietary wireless, not IP — the system cannot detect these and should not recommend network actions for them. No template guards against this technical error. However, CLAUDE.md explicitly excludes RF protocol detection from scope, so this may be out-of-scope by design."
      rf_protocol_note: "If the system generates an alert for an insulin pump, the pump must be IP-connected (hospital WiFi insulin pumps do exist — e.g., Insulet Omnipod 5 with hospital WiFi integration). The DO NOT constraint should prohibit actions that disrupt the insulin delivery control loop, not EHR gateway connectivity."

    - device_class: "DC-05 — EHR workstation during active clinical documentation"
      spec_example: "DO NOT lock workstation if shared by night-shift clinical staff — isolate user session only."
      implementation_output: "DO NOT lock shared workstations — isolate user session only, preserve active clinical staff access."
      do_not_present: true
      physical_action_prohibited: false
      physical_action_detail: "Physical lockout is not the concern here — session isolation is the correct safe action."
      network_action_permitted: false
      network_action_detail: "Action is session-level (disable EHR session, force MFA) not network-level. This is appropriate for EHR access alerts."
      clinical_coordination_named: false
      coordination_gap: "Spec requires charge nurse on duty. Implementation escalation is '(1) Privacy Officer, (2) Security lead, (3) HR' — no charge nurse. If the user whose session is disabled is actively documenting patient care, the charge nurse needs to know to reassign documentation."
      imp03_format_compliant: false
      imp03_gap: "IMP-03 applies to IoMT behavioral deviation only, not EHR access. N/A for this device class."
      status: "PARTIAL"
      gap: "Constraint is well-scoped (session isolation, not workstation lockout). Main gap: charge nurse missing from escalation. For a night-shift EHR access alert, the charge nurse is the person who can confirm float nurse authorization and manage documentation reassignment."

    - device_class: "DC-06 — PACS server during active radiology reads"
      spec_example: "DO NOT block all PACS outbound — active radiology reads depend on image delivery to approved partners."
      implementation_output: "DO NOT block all outbound from this system — approved clinical partners require continued data exchange."
      do_not_present: true
      physical_action_prohibited: false
      physical_action_detail: "PACS is a server — physical action concern is shutdown, not disconnection. Constraint does not mention shutdown."
      network_action_permitted: true
      network_action_detail: "immediate_action says 'Block outbound TCP from [source] to [destination]' — a destination-specific block, which is the correct safe action."
      clinical_coordination_named: false
      coordination_gap: "Spec requires 'Radiology IT admin.' Implementation has '(1) Security lead, (2) Department IT admin, (3) Privacy Officer.' 'Department IT admin' is close but not specific to Radiology. For a PACS exfiltration alert during active reads, the Radiology department head should be notified."
      imp03_format_compliant: false
      imp03_gap: "IMP-03 applies to IoMT behavioral deviation, not data exfiltration. However, IMP-06 (scope_and_preservation_statement) applies. Implementation uses the T4 exfiltration template which does include scope but does not use the IMP-06 format explicitly."
      status: "PARTIAL"
      gap: "Closest to complete among all 6. Constraint correctly scopes the block (destination-specific, not full outbound). Main gap: Radiology IT not explicitly named, and PACS shutdown is not prohibited (unlikely but possible operator action)."

  overall_completeness_rate: "0/6 device classes fully COMPLETE"
  partial_count: "6/6 PARTIAL"
  missing_count: "0/6 MISSING"

  cross_cutting_gaps:
    imp03_not_implemented:
      description: "IMP-03 (action_level_clarification) is defined in the spec with a complete example for ventilator alerts, but the rule-based templates in src/mve_generator.py have not been updated. All IoMT device classes output the pre-IMP-03 generic 'DO NOT isolate from EHR gateway' instead of the 'DO NOT [physical] — SAFE: [network] — Contact [role]' format."
      affected_devices: ["DC-01", "DC-02", "DC-03", "DC-04"]
      severity: "HIGH — this was the root cause of the 44% failure rate on alert_18 (ventilator Telnet) in the user study"

    no_device_class_differentiation:
      description: "All four IoMT device classes (infusion_pump, ventilator, patient_monitor, insulin_pump) produce IDENTICAL Layer 3 output from the T5 template. The constraint does not change based on device_type, clinical_function, or criticality within T5. A ventilator and a patient monitor receive the same 'DO NOT isolate from EHR gateway' despite having fundamentally different patient safety profiles."
      affected_devices: ["DC-01", "DC-02", "DC-03", "DC-04"]
      severity: "HIGH — the FMEA identified device-class-specific constraints as a requirement (FM-L2-09)"

    charge_nurse_missing:
      description: "No IoMT template includes the charge nurse in the escalation path. The spec's Example 1 (infusion pump) explicitly includes 'ICU charge nurse.' The charge nurse is the person who manages patient care reassignment when a device is taken offline."
      affected_devices: ["DC-01", "DC-02", "DC-05"]
      severity: "MEDIUM — biomed covers the technical coordination, but nursing needs to prepare for device handoff"

  gate_3_pass: false
  blocking_gaps:
    - "IMP-03 not implemented in rule-based templates (all 4 IoMT device classes)"
    - "No device-class differentiation in T5 template (ventilator = pump = monitor)"
    - "Physical disconnection not explicitly prohibited for DC-01 (pump) and DC-02 (ventilator)"
  recommendation: >
    Implement device-class-specific Layer 3 output in the T5 template. Use device_type
    to select the correct DO NOT constraint, SAFE statement, and escalation path:
    (1) ventilator: 'DO NOT power off or disconnect — SAFE: block port at switch'
    (2) infusion_pump: 'DO NOT power-cycle during active infusion — SAFE: NAC quarantine'
    (3) patient_monitor: 'DO NOT isolate from EHR gateway — SAFE: DNS rate-limit'
    (4) insulin_pump: 'DO NOT disrupt wireless control loop — verify IP vs RF connectivity first'
    This requires adding a device_type switch inside the T5 template handler in
    src/mve_generator.py _generate_rule_based(), using the IMP-03 format for each.
    Estimated effort: 1 template function change, ~40 lines of device-specific constraints.
