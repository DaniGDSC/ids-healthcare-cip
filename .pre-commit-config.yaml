# Pre-commit hooks. Install with:
#   pip install pre-commit
#   pre-commit install
#
# Tier 3 F1 added gitleaks after real RSA keys were committed at
# `config/certs/test/*-key.pem` in 2026-03/04 (later deleted from the
# working tree but recoverable from history). This config makes the
# same mistake structurally impossible.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks (block secrets in commit)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^\.github/workflows/  # workflows have GH-specific syntax
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--config=pyproject.toml"]
        files: ^(common|module[0-6]_|detection_engine|src)/
