# ================================================================
# VIỆC 1: TESTABLE CLAIMS
# ================================================================

testable_claims:

  - claim_id: "C1"
    original_text: "explainable anomaly narratives that translate network detections into clinically contextualized alerts"
    is_testable: true
    type: "output_quality"
    requires_what_to_test:
      data: "Set of ≥50 raw IDS alerts (10 per alert type × 5 types) with ground-truth device inventory, clinical system mapping, and baseline behavioral profiles."
      environment: "XAI engine with loaded asset inventory and 90-day behavioral baseline per device/user."
      evaluator: "automated"

  - claim_id: "C2"
    original_text: "risk-adaptive thresholds that auto-adjust detection sensitivity based on device patchability and clinical criticality"
    is_testable: true
    type: "behavior"
    requires_what_to_test:
      data: "Device inventory with patchability flags (patchable/unpatchable) and clinical criticality labels (CRITICAL/HIGH/MEDIUM/LOW). Simulated alert stream with identical anomaly scores across device classes."
      environment: "Risk-adaptive scoring engine with device context database."
      evaluator: "automated"

  - claim_id: "C3"
    original_text: "clinical-constraint-aware response recommendations"
    is_testable: true
    type: "output_quality"
    requires_what_to_test:
      data: "≥25 alert scenarios involving clinical systems (infusion pumps during active delivery, PACS during radiology reads, monitors with active patients). Ground-truth clinical constraint per scenario."
      environment: "Recommendation engine with clinical system state awareness."
      evaluator: "both"

  - claim_id: "C4"
    original_text: "enabling correct triage from non-specialist operators"
    is_testable: true
    type: "user_impact"
    requires_what_to_test:
      data: "20 alert scenarios (4 per type × 5 types) with established correct triage decisions validated by senior security analyst + clinical engineer."
      environment: "A/B test setup: group A sees raw IDS output only, group B sees raw IDS + MVE. Both groups are IT generalists (2-4 years experience)."
      evaluator: "human"

  - claim_id: "C5"
    original_text: "reducing dwell time for non-ransomware intrusions"
    is_testable: false
    why_not_testable: >
      Dwell time reduction requires longitudinal deployment in a live
      healthcare environment measuring time-from-compromise-to-detection
      before and after XAI IDS deployment. This is a Phase 2 field study,
      not achievable at prototype stage. Proxy metric: triage decision
      speed (C4) as a leading indicator.

  - claim_id: "C6"
    original_text: "who currently miss 82% of monitoring-detectable intrusions (DBIR 2025)"
    is_testable: false
    why_not_testable: >
      82% figure is from DBIR cross-industry aggregate. Validating this
      for the target segment requires access to operational alert logs
      from 200-500 bed hospitals — not available at research stage.
      Used as motivation, not as a claim the system itself validates.

  - claim_id: "C7"
    original_text: "MVE contains 3 layers with all required elements within 150-word constraint"
    is_testable: true
    type: "output_quality"
    requires_what_to_test:
      data: "Same ≥50 alert set as C1."
      environment: "XAI output generator."
      evaluator: "automated"

  - claim_id: "C8"
    original_text: "alert fatigue reduction via risk-adaptive thresholds"
    is_testable: true
    type: "performance"
    requires_what_to_test:
      data: "Labeled alert stream with ground-truth: true positive / false positive / legitimate-but-rare. Minimum 200 alerts with ~60% false-positive rate (matching vendor review complaints)."
      environment: "Risk-adaptive engine with baseline profiles and maintenance schedules loaded."
      evaluator: "automated"

  # --- CLASSIFICATION ---

  claims_testable_in_code: ["C1", "C2", "C3", "C7", "C8"]
  claims_require_user_study: ["C4"]
  claims_untestable_at_prototype_stage: ["C5", "C6"]


# ================================================================
# VIỆC 2: SUCCESS METRICS
# ================================================================

success_metrics:

  - claim_id: "C7"
    metric_id: "M1"
    metric_name: "MVE Completeness"
    metric_type: "coverage"
    formula: "(alerts with all 3 layers complete AND all required_elements present) / total alerts generated"
    target_value: "≥95%"
    target_justification: "MVE is a structured output format — if the system generates an MVE, it should be structurally complete. 95% allows for edge cases where insufficient context data prevents a required element (e.g., device not in inventory)."
    acceptable_minimum: "≥85%"
    measurement_method: "Parse each MVE output, check presence of: baseline_behavior, deviation_description, confidence_indicator (L1); affected_system, patient_care_impact, phi_exposure, severity_label (L2); immediate_action, clinical_constraint, escalation_path, timeframe (L3)."
    baseline_comparison: "Standard IDS: 0% (produces no structured explanation)."

  - claim_id: "C1"
    metric_id: "M2"
    metric_name: "Clinical Relevance"
    metric_type: "accuracy"
    formula: "(Layer 2 outputs that correctly identify the clinical system type AND mention patient-care impact) / total Layer 2 outputs"
    target_value: "≥90%"
    target_justification: "Clinical relevance is the core value proposition — the entire point of Layer 2. If the system can't correctly identify which clinical system is affected in 9/10 alerts, the explanation is worse than useless (creates false confidence). Requires accurate asset inventory as input."
    acceptable_minimum: "≥75%"
    measurement_method: "Compare Layer 2 affected_system field against ground-truth device-to-clinical-function mapping. Score: 1 if correct system type AND patient impact mentioned, 0.5 if system type correct but impact generic, 0 if wrong system type."
    baseline_comparison: "Standard IDS: 0% (no clinical context in output). IoMT platforms (Claroty/Armis): partial — provide device type but not patient-care impact framing (B3: 5/5 vendors criticized for this gap)."

  - claim_id: "C3"
    metric_id: "M3"
    metric_name: "Actionability"
    metric_type: "rating_scale"
    formula: "(Layer 3 outputs with specific executable action — named policy/rule, not vague) / total Layer 3 outputs"
    target_value: "≥85%"
    target_justification: "B4 falsification identified vague advice ('investigate further') as the fail condition. 85% accounts for novel alert scenarios where the system cannot map to a known policy and must fall back to escalation-only."
    acceptable_minimum: "≥70%"
    measurement_method: "Automated check: Layer 3 immediate_action field must contain at least one of: named NAC/firewall policy, specific session action (disable/force-reauth), named network segment action (block IP, rate-limit). If field contains only 'investigate,' 'monitor,' or 'consider' without a specific step → fail."
    baseline_comparison: "Standard IDS: 0% (no action recommendations). SOAR playbooks: ~90% (but not clinically constrained — may recommend actions that disrupt care)."

  - claim_id: "C3"
    metric_id: "M4"
    metric_name: "Clinical Constraint Awareness"
    metric_type: "coverage"
    formula: "(Layer 3 outputs with explicit DO NOT statement when alert involves clinical system) / (alerts involving clinical systems)"
    target_value: "≥90%"
    target_justification: "Clinical constraints are the differentiator between healthcare IDS and generic IDS. If the system recommends disconnecting an infusion pump during active delivery, the 'explanation' causes patient harm. 90% target because some alerts on clinical subnets involve non-patient-facing infrastructure where constraints are unnecessary."
    acceptable_minimum: "≥80%"
    measurement_method: "Filter alerts where affected_system maps to patient-care categories (CRITICAL or HIGH severity). Check Layer 3 for 'DO NOT' pattern followed by clinical-context clause. Score 1 if present and clinically correct, 0 if absent or incorrect constraint."
    baseline_comparison: "Standard IDS: 0%. SOAR playbooks: ~10% (rare to include clinical workflow awareness)."

  - claim_id: "C4"
    metric_id: "M5"
    metric_name: "Triage Decision Accuracy"
    metric_type: "accuracy"
    formula: "(correct triage decisions by IT generalists with MVE) / total decisions WITH MVE vs. (correct decisions without MVE) / total decisions WITHOUT MVE"
    target_value: "≥30% relative improvement in accuracy (MVE group vs. control group)"
    target_justification: "B4 evidence: generalists currently face two failure modes — under-reaction (ignoring) and over-reaction (disrupting care). MVE should reduce both. 30% improvement is meaningful but conservative — accounts for generalists who already make correct decisions on simpler alerts."
    acceptable_minimum: "≥15% relative improvement AND statistically significant (p<0.05)"
    measurement_method: "Controlled user study: n≥20 IT generalists, randomized A/B, 20 alert scenarios each. Measure: (1) correct severity classification, (2) correct action choice, (3) time to decision, (4) confidence rating (1-5 Likert). Primary metric: composite accuracy (severity + action both correct)."
    baseline_comparison: "Control group (raw IDS output only) serves as baseline."

  - claim_id: "C8"
    metric_id: "M6"
    metric_name: "Alert Fatigue Reduction (False Positive Suppression)"
    metric_type: "precision"
    formula: "(true positives surfaced by risk-adaptive engine) / (true positives + false positives surfaced) compared to (TP / (TP + FP)) from baseline IDS"
    target_value: "≥40% reduction in false positive rate vs. baseline IDS with static thresholds"
    target_justification: "B3: Asimily/Ordr reviews report 'legitimate but rare' events as primary false-positive source. Risk-adaptive baselines that learn maintenance schedules and vendor access patterns should suppress this class. 40% is conservative compared to Seceon's claimed 95% (vendor marketing, not peer-reviewed)."
    acceptable_minimum: "≥20% reduction"
    measurement_method: "Run labeled alert stream (200 alerts, ~60% FP) through baseline IDS (static rules) and risk-adaptive engine (with learned baselines). Compare precision. Labeled ground truth must include 'legitimate-but-rare' category."
    baseline_comparison: "Same alert stream through IDS with static/default thresholds."

  - claim_id: "C2"
    metric_id: "M7"
    metric_name: "Risk-Adaptive Threshold Behavior"
    metric_type: "behavior"
    formula: "For identical anomaly score X: alert threshold for unpatchable CRITICAL device < threshold for patchable LOW device"
    target_value: "100% of unpatchable CRITICAL devices have lower (more sensitive) alert thresholds than patchable LOW devices"
    target_justification: "C3 resolution in v2: unpatchable devices need permanently elevated risk scores with lower thresholds as compensating control. This is binary — the system either adapts or it doesn't."
    acceptable_minimum: "100% (binary pass/fail)"
    measurement_method: "Configure device inventory with known patchability and criticality labels. Send identical anomaly event to devices in each category. Verify that CRITICAL-unpatchable triggers alert while LOW-patchable does not (or triggers at lower priority)."
    baseline_comparison: "Static-threshold IDS: same threshold for all devices regardless of context → 0% adaptation."

  - claim_id: "C1"
    metric_id: "M8"
    metric_name: "Severity Label Accuracy"
    metric_type: "accuracy"
    formula: "(correct severity labels assigned by system) / total alerts with ground-truth severity"
    target_value: "≥80% exact match with expert-assigned severity (CRITICAL/HIGH/MEDIUM/LOW)"
    target_justification: "4-class classification on clinical-context severity. 80% allows for borderline cases (e.g., PACS during overnight hours: HIGH or MEDIUM depends on whether radiologist is actively reading). Expert disagreement rate on 4-class severity is estimated at ~15-20%, so 80% approaches human ceiling."
    acceptable_minimum: "≥70% exact match OR ≥90% within ±1 level (no CRITICAL↔LOW mismatches)"
    measurement_method: "50 alerts labeled by 2 senior security analysts + 1 clinical engineer (majority vote). Compare system labels against consensus ground truth."
    baseline_comparison: "Standard IDS severity (CVSS-based): expected ~40-50% match with clinical severity because CVSS ignores patient-care context."


# ================================================================
# VIỆC 3: ACCEPTANCE TESTS (PSEUDO-CODE)
# ================================================================

acceptance_tests_pseudo_code: |

  # ================================================================
  # acceptance_tests.py
  # Automated acceptance tests for XAI-Enhanced IDS MVE output
  # ================================================================

  from dataclasses import dataclass
  from typing import List, Optional
  import re

  # --- Data structures ---

  @dataclass
  class MVEOutput:
      layer_1: dict  # keys: baseline_behavior, deviation_description, confidence_indicator
      layer_2: dict  # keys: affected_system, patient_care_impact, phi_exposure, severity_label
      layer_3: dict  # keys: immediate_action, clinical_constraint, escalation_path, timeframe
      total_word_count: int
      alert_involves_clinical_system: bool

  @dataclass
  class AlertGroundTruth:
      alert_id: str
      true_severity: str          # CRITICAL / HIGH / MEDIUM / LOW
      true_clinical_system: str   # e.g., "infusion pump network"
      true_label: str             # true_positive / false_positive / legitimate_rare
      device_patchable: bool
      device_criticality: str     # CRITICAL / HIGH / MEDIUM / LOW

  # --- Constants ---
  L1_REQUIRED = ["baseline_behavior", "deviation_description", "confidence_indicator"]
  L2_REQUIRED = ["affected_system", "patient_care_impact", "phi_exposure", "severity_label"]
  L3_REQUIRED = ["immediate_action", "clinical_constraint", "escalation_path", "timeframe"]
  VALID_SEVERITY = {"CRITICAL", "HIGH", "MEDIUM", "LOW"}
  MAX_TOTAL_WORDS = 150
  MAX_LAYER_WORDS = 60
  VAGUE_PATTERNS = re.compile(
      r"\b(investigate further|monitor closely|consider isolating|"
      r"contact appropriate|as needed|if necessary)\b", re.IGNORECASE
  )


  # ================================================================
  # TEST M1: MVE Completeness
  # ================================================================

  def test_mve_completeness(outputs: List[MVEOutput]):
      """
      Claim C7: MVE contains 3 layers with all required elements.
      Pass: ≥95% of outputs have all required elements.
      Fail: <85% completeness.
      """
      complete = 0
      for mve in outputs:
          l1_ok = all(mve.layer_1.get(k) for k in L1_REQUIRED)
          l2_ok = all(mve.layer_2.get(k) for k in L2_REQUIRED)
          l3_ok = all(mve.layer_3.get(k) for k in L3_REQUIRED)
          if l1_ok and l2_ok and l3_ok:
              complete += 1
      rate = complete / len(outputs)
      assert rate >= 0.85, f"MVE completeness {rate:.1%} below minimum 85%"
      if rate < 0.95:
          print(f"WARNING: MVE completeness {rate:.1%} below target 95%")
      return rate


  # ================================================================
  # TEST M2: Clinical Relevance
  # ================================================================

  def test_clinical_relevance(outputs: List[MVEOutput], ground_truths: List[AlertGroundTruth]):
      """
      Claim C1: Layer 2 correctly identifies clinical system and
      mentions patient-care impact.
      Pass: ≥90% correct. Fail: <75%.
      """
      scores = []
      for mve, gt in zip(outputs, ground_truths):
          system_correct = gt.true_clinical_system.lower() in mve.layer_2["affected_system"].lower()
          has_patient_impact = bool(re.search(
              r"patient|care|infusion|vital|medication|clinical|treatment",
              mve.layer_2.get("patient_care_impact", ""), re.IGNORECASE
          ))
          if system_correct and has_patient_impact:
              scores.append(1.0)
          elif system_correct:
              scores.append(0.5)
          else:
              scores.append(0.0)
      rate = sum(scores) / len(scores)
      assert rate >= 0.75, f"Clinical relevance {rate:.1%} below minimum 75%"
      if rate < 0.90:
          print(f"WARNING: Clinical relevance {rate:.1%} below target 90%")
      return rate


  # ================================================================
  # TEST M3: Actionability
  # ================================================================

  def test_actionability(outputs: List[MVEOutput]):
      """
      Claim C3: Layer 3 provides specific executable action,
      not vague advice.
      Pass: ≥85% specific. Fail: <70%.
      """
      specific = 0
      for mve in outputs:
          action = mve.layer_3.get("immediate_action", "")
          is_vague = bool(VAGUE_PATTERNS.search(action))
          has_specific = bool(re.search(
              r"(block|isolate|disable|apply|force|rate-limit|quarantine|NAC|firewall|policy)",
              action, re.IGNORECASE
          ))
          if has_specific and not is_vague:
              specific += 1
      rate = specific / len(outputs)
      assert rate >= 0.70, f"Actionability {rate:.1%} below minimum 70%"
      if rate < 0.85:
          print(f"WARNING: Actionability {rate:.1%} below target 85%")
      return rate


  # ================================================================
  # TEST M4: Clinical Constraint Awareness
  # ================================================================

  def test_clinical_constraint_awareness(outputs: List[MVEOutput]):
      """
      Claim C3: Layer 3 includes DO NOT statement when alert
      involves clinical system.
      Pass: ≥90% of clinical alerts have constraint. Fail: <80%.
      """
      clinical_alerts = [m for m in outputs if m.alert_involves_clinical_system]
      if not clinical_alerts:
          return 1.0  # no clinical alerts to test
      has_constraint = 0
      for mve in clinical_alerts:
          constraint = mve.layer_3.get("clinical_constraint", "")
          if re.search(r"DO NOT|do not|Do not", constraint):
              has_constraint += 1
      rate = has_constraint / len(clinical_alerts)
      assert rate >= 0.80, f"Clinical constraint awareness {rate:.1%} below minimum 80%"
      if rate < 0.90:
          print(f"WARNING: Clinical constraint {rate:.1%} below target 90%"  )
      return rate


  # ================================================================
  # TEST M8: Severity Label Accuracy
  # ================================================================

  def test_severity_label_accuracy(outputs: List[MVEOutput], ground_truths: List[AlertGroundTruth]):
      """
      Claim C1: System assigns correct CRITICAL/HIGH/MEDIUM/LOW
      severity label matching expert consensus.
      Pass: ≥80% exact match. Fail: <70% exact OR any CRITICAL↔LOW.
      """
      exact = 0
      catastrophic_miss = 0
      LEVEL = {"CRITICAL": 3, "HIGH": 2, "MEDIUM": 1, "LOW": 0}
      for mve, gt in zip(outputs, ground_truths):
          predicted = mve.layer_2.get("severity_label", "").upper()
          actual = gt.true_severity.upper()
          assert predicted in VALID_SEVERITY, f"Invalid severity: {predicted}"
          if predicted == actual:
              exact += 1
          if abs(LEVEL.get(predicted, -1) - LEVEL.get(actual, -1)) == 3:
              catastrophic_miss += 1
      exact_rate = exact / len(outputs)
      assert catastrophic_miss == 0, f"{catastrophic_miss} CRITICAL↔LOW mismatches (catastrophic)"
      assert exact_rate >= 0.70, f"Severity accuracy {exact_rate:.1%} below minimum 70%"
      if exact_rate < 0.80:
          print(f"WARNING: Severity accuracy {exact_rate:.1%} below target 80%")
      return exact_rate


  # ================================================================
  # TEST: Layer 1 Length Constraint
  # ================================================================

  def test_layer1_length_constraint(outputs: List[MVEOutput]):
      """
      MVE Spec: Each layer ≤60 words, total ≤150 words.
      Pass: ≥95% within limits. Fail: <90%.
      """
      within_limit = 0
      for mve in outputs:
          l1_words = len(mve.layer_1.get("baseline_behavior", "").split()) + \
                     len(mve.layer_1.get("deviation_description", "").split()) + \
                     len(mve.layer_1.get("confidence_indicator", "").split())
          total = mve.total_word_count
          if l1_words <= MAX_LAYER_WORDS and total <= MAX_TOTAL_WORDS:
              within_limit += 1
      rate = within_limit / len(outputs)
      assert rate >= 0.90, f"Length compliance {rate:.1%} below minimum 90%"
      if rate < 0.95:
          print(f"WARNING: Length compliance {rate:.1%} below target 95%")
      return rate


  # ================================================================
  # TEST M6: False Positive Reduction
  # ================================================================

  def test_false_positive_rate(
      baseline_results: List[dict],
      adaptive_results: List[dict],
      ground_truths: List[AlertGroundTruth]
  ):
      """
      Claim C8: Risk-adaptive thresholds reduce false positive rate
      by ≥40% vs. static-threshold baseline.
      Pass: ≥40% FP reduction. Fail: <20% reduction.
      """
      def calc_fp_rate(results, gts):
          surfaced = [(r, g) for r, g in zip(results, gts) if r["surfaced"]]
          if not surfaced:
              return 0.0
          fp = sum(1 for r, g in surfaced if g.true_label != "true_positive")
          return fp / len(surfaced)

      baseline_fpr = calc_fp_rate(baseline_results, ground_truths)
      adaptive_fpr = calc_fp_rate(adaptive_results, ground_truths)

      if baseline_fpr == 0:
          return 1.0  # no FPs to reduce

      reduction = (baseline_fpr - adaptive_fpr) / baseline_fpr
      assert reduction >= 0.20, \
          f"FP reduction {reduction:.1%} below minimum 20% (baseline={baseline_fpr:.1%}, adaptive={adaptive_fpr:.1%})"
      if reduction < 0.40:
          print(f"WARNING: FP reduction {reduction:.1%} below target 40%")
      return reduction


  # ================================================================
  # TEST M7: Risk-Adaptive Threshold Behavior
  # ================================================================

  def test_risk_adaptive_threshold(engine, test_events: List[dict]):
      """
      Claim C2: Unpatchable CRITICAL devices get lower (more sensitive)
      alert thresholds than patchable LOW devices.
      Pass: 100% correct ordering. Fail: any violation.
      """
      for event in test_events:
          crit_unpatchable = engine.get_threshold(
              device_criticality="CRITICAL", patchable=False
          )
          low_patchable = engine.get_threshold(
              device_criticality="LOW", patchable=True
          )
          assert crit_unpatchable < low_patchable, \
              f"CRITICAL-unpatchable threshold ({crit_unpatchable}) must be " \
              f"lower (more sensitive) than LOW-patchable ({low_patchable})"
      return True


# ================================================================
# HUMAN EVALUATION RUBRICS (for claims requiring user study)
# ================================================================

human_evaluation_rubrics:

  - metric: "M5_triage_decision_accuracy"
    claim: "C4 — enabling correct triage from non-specialist operators"

    study_design:
      participants: "n≥20 IT generalists with 2-4 years experience in hospital IT (not security specialists)"
      assignment: "Random assignment to Group A (raw IDS only) or Group B (raw IDS + MVE)"
      scenarios: "20 alert scenarios (4 per type × 5 alert types from MVE spec), presented in randomized order"
      ground_truth: "Correct triage decision pre-established by panel: 2 senior security analysts + 1 clinical engineer (majority vote)"

    per_scenario_task:
      instruction_to_participant: >
        You are the on-shift IT security person at a 300-bed hospital.
        It is [time from scenario]. You receive the following alert.
        Based on the information provided:
        1. Rate the severity: CRITICAL / HIGH / MEDIUM / LOW
        2. Choose an action: [4 options specific to scenario, including correct action, over-reaction, under-reaction, and irrelevant action]
        3. Rate your confidence in your decision: 1 (guessing) to 5 (certain)
        4. How long did it take you to decide? [self-reported seconds]

    scoring:
      severity_correct: "1 point if exact match, 0.5 if within ±1 level, 0 if ≥2 levels off"
      action_correct: "1 point if matches ground truth, 0 otherwise"
      composite_accuracy: "(severity_score + action_score) / 2 per scenario, averaged across 20 scenarios"

    pass_threshold: "Group B composite accuracy ≥ Group A + 30% relative improvement, with p<0.05 (two-tailed t-test or Mann-Whitney U)"
    acceptable_minimum: "≥15% relative improvement AND p<0.05"

    secondary_metrics:
      - "Time to decision: Group B should NOT be significantly slower than Group A (MVE adds info but should not slow triage)"
      - "Confidence rating: Group B should report higher mean confidence than Group A"
      - "Over-reaction rate: Group B should have fewer 'care-disrupting action' selections on clinical-system alerts"
      - "Under-reaction rate: Group B should have fewer 'dismiss' selections on TRUE POSITIVE alerts"


