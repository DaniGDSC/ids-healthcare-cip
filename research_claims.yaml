negative_tests_pseudo_code: |

  # ================================================================
  # negative_tests.py
  # Tests that verify the system stays WITHIN defined scope
  # ================================================================


  def test_no_device_discovery_attempted(system_logs: List[dict]):
      """
      Out of scope: Asset discovery (solved by Claroty/Armis/Medigate).
      System must consume existing device inventory, never attempt
      network scanning, fingerprinting, or device identification.
      """
      discovery_patterns = ["nmap", "scan", "fingerprint", "discover",
                            "probe", "enumerate_devices"]
      for log in system_logs:
          action = log.get("action", "").lower()
          assert not any(p in action for p in discovery_patterns), \
              f"System attempted device discovery: {log}"


  def test_no_automated_blocking(system_actions: List[dict]):
      """
      Out of scope: Automated enforcement (SOAR).
      System must RECOMMEND actions, never execute them.
      All output must be advisory — human decides and acts.
      """
      enforcement_actions = ["block_executed", "quarantine_applied",
                             "session_terminated", "rule_pushed",
                             "firewall_updated"]
      for action in system_actions:
          assert action["type"] == "recommendation", \
              f"System executed action instead of recommending: {action}"
          assert action["type"] not in enforcement_actions, \
              f"System performed automated enforcement: {action}"


  def test_no_rf_protocol_claims(outputs: List[dict]):
      """
      Out of scope: IoMT device-specific RF protocol attacks
      (CVE-2019-10964, CVE-2022-32537 — proprietary wireless).
      System must not claim detection capability for non-IP
      medical device protocols.
      """
      rf_keywords = ["bluetooth", "zigbee", "RF protocol",
                     "wireless pairing", "radio frequency",
                     "proprietary wireless"]
      for output in outputs:
          explanation = output.get("layer_1_why_anomalous", "").lower()
          assert not any(k.lower() in explanation for k in rf_keywords), \
              f"System claimed RF protocol detection: {output['alert_id']}"


  def test_no_ransomware_dwell_time_claims(outputs: List[dict]):
      """
      Out of scope: Ransomware detection (actor self-discloses,
      dwell time ≈ 0). System addresses non-ransomware intrusions.
      Ransomware alerts may be processed but system must not claim
      it 'detected' ransomware faster than actor disclosure.
      """
      for output in outputs:
          if output.get("alert_subtype") == "ransomware":
              explanation = output.get("layer_1_why_anomalous", "")
              assert "early detection" not in explanation.lower(), \
                  f"System claimed early ransomware detection for {output['alert_id']} " \
                  f"— ransomware is actor-disclosed, not system-detected"


  def test_severity_uses_clinical_not_cvss(outputs: List[dict]):
      """
      MVE spec: Severity labels must be based on clinical impact
      (patient care, PHI exposure), NOT raw CVSS scores.
      """
      for output in outputs:
          rationale = output.get("layer_2", {}).get("severity_rationale", "")
          assert "CVSS" not in rationale, \
              f"Severity rationale uses CVSS instead of clinical impact: {output['alert_id']}"


  def test_no_model_internals_exposed(outputs: List[dict]):
      """
      MVE spec what_NOT_to_include: no SHAP values, model architecture,
      p-values, or competing hypotheses in explanation output.
      """
      forbidden = ["shap", "feature importance", "random forest",
                   "neural network", "p-value", "standard deviation",
                   "confidence interval", "hypothesis"]
      for output in outputs:
          full_text = str(output.get("layer_1_why_anomalous", "")).lower()
          for term in forbidden:
              assert term not in full_text, \
                  f"Model internals exposed in explanation: '{term}' in {output['alert_id']}"


