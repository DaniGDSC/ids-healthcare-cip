# SUMMARY
# ================================================================

summary:

  claims_testable_in_code:
    - "C1: Clinically contextualized alert narratives (M2 clinical relevance, M8 severity accuracy)"
    - "C2: Risk-adaptive threshold behavior (M7)"
    - "C3: Clinical-constraint-aware recommendations (M3 actionability, M4 constraint awareness)"
    - "C7: MVE structural completeness (M1)"
    - "C8: Alert fatigue reduction (M6 false positive rate)"

  claims_require_user_study:
    - "C4: Triage decision accuracy improvement (M5 — A/B study with n≥20 IT generalists)"

  claims_untestable_at_prototype:
    - "C5: Dwell time reduction (requires longitudinal field deployment)"
    - "C6: 82% missed intrusions (DBIR aggregate; requires operational log access)"

  minimum_dataset_needed: >
    50 labeled alert scenarios (10 per type × 5 types) with:
    - Ground-truth device-to-clinical-function mapping
    - Ground-truth severity labels (expert consensus)
    - Ground-truth true-positive/false-positive/legitimate-rare labels
    - 90-day simulated behavioral baselines per device/user
    - Device patchability and criticality metadata
    Sources: can be synthetically generated from real hospital
    network topology templates + published IoMT vulnerability data (A4).

  minimum_environment_needed: >
    - XAI explanation engine (generates 3-layer MVE from raw alert + context)
    - Risk-adaptive scoring engine (adjusts thresholds by device context)
    - Device inventory database (IP → device → clinical function → criticality)
    - Behavioral baseline store (90-day per-device communication profiles)
    - Alert simulation harness (replays labeled alert stream through engines)
    For user study (M5): web-based alert triage interface showing
    raw IDS output (Group A) or raw + MVE (Group B).
