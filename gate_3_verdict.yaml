gate_3_verdict:
  evaluation_date: "2026-04-13"
  evaluated_by: "Research QA Engineer"
  inputs:
    - fmea_report.yaml
    - safety_tests.yaml

  checklist:
    fmea_l1_no_blockers: true
    fmea_l2_no_blockers: true
    fmea_l3_no_blockers: true
    do_not_enforced_by_spec: true
    action_level_distinction_enforced: true
    no_unacceptable_residual_risk: true
    safety_tests_specified: true
    do_not_completeness_pass: false

  checklist_summary: "7/8 pass, 1/8 fail"

  verdict: "GO_WITH_CAVEAT"
  verdict_rationale: >
    The single failing criterion (do_not_completeness_pass) is a template
    implementation gap, not a design or architectural deficiency. The
    mve_specification.yaml correctly defines IMP-03 (action_level_clarification)
    with a complete ventilator example. The DO NOT constraint exists in all
    templates (M4 = 100%). The gap is that the rule-based T5 template produces
    generic IoMT constraints instead of device-class-specific ones. This does
    not block paper writing because: (1) the spec is correct, (2) the user
    study alert scenarios (A-18 ventilator Telnet) used the IMP-03 format
    directly, (3) the FMEA analysis is complete and honestly documents the
    gap, and (4) the fix is a known template change (~40 lines) that can be
    completed before any field deployment.

  blocking_issues: []

  caveats_for_paper:
    - caveat: "IMP-03 not implemented in rule-based templates"
      section: "Limitations"
      text: >
        The action_level_clarification (IMP-03) that distinguishes physical
        device actions from safe network-layer controls is defined in the MVE
        specification and was used in user study alert scenarios, but has not
        been backported to the rule-based template generator. All four IoMT
        device classes (infusion pump, ventilator, patient monitor, insulin
        pump) produce identical Layer 3 constraints. Device-class-specific
        constraints must be implemented before clinical deployment.

    - caveat: "DO NOT completeness is 0/6 COMPLETE (6/6 PARTIAL)"
      section: "Limitations"
      text: >
        No device class achieves full DO NOT constraint completeness per the
        IMP-03 specification. All 6 have a DO NOT clause present, but none
        include the required SAFE network-action statement or device-class-
        specific physical action prohibition. The ventilator constraint does
        not explicitly block power-off — the most dangerous operator action.

    - caveat: "5 unsafe safe-failure gaps identified (ST-01, -02, -03, -05, -07)"
      section: "Limitations and Future Work"
      text: >
        Five edge cases produce unsafe system behavior: unknown device
        defaults to LOW (should be CRITICAL), empty device context produces
        LOW with no warning, CRITICAL+unpatchable device suppressed at low
        anomaly score, invalid criticality passes through unchecked, and
        HIGH confidence produced on 0-day baseline. Safety test
        specifications are documented; code implementation is required
        before Phase 3 deployment.

    - caveat: "SHAP stability FAIL (cross-model)"
      section: "Limitations"
      text: >
        Cross-model SHAP stability fails (sign consistency 0.67, CV 1.22).
        This is structural (3 different model families) and does not affect
        clinician narratives (XGBoost only, narrative-level stability 0.85).
        Documented as a limitation of multi-model SHAP comparison.

  highest_rpn_items:
    - id: "FM-L1-10"
      rpn: 448
      layer: "Layer 1"
      summary: "Unpatchable device status not communicated in Layer 1 — operator plans patch remediation that will never arrive"
    - id: "FM-L2-06"
      rpn: 245
      layer: "Layer 2"
      summary: "All infusion pump alerts CRITICAL regardless of operational state — alert fatigue on highest-risk device class"
    - id: "FM-L1-09"
      rpn: 240
      layer: "Layer 1"
      summary: "Vendor maintenance indistinguishable from genuine threat — false positive on life-sustaining device during firmware update"

  total_failure_modes_analyzed: 32
  critical_rpn_count: 5
  high_rpn_count: 10
  residual_risk_distribution:
    ACCEPTABLE: 26
    MONITOR: 6
    UNACCEPTABLE: 0

  paper_safety_section_recommendation: >
    The paper must include a Clinical Safety Analysis section citing the FMEA
    methodology, the 32 failure modes analyzed across all 3 MVE layers, and
    the 5 CRITICAL-RPN items (FM-L1-10, FM-L2-06, FM-L1-09, FM-L1-03,
    FM-L3-02). The highest-severity finding (FM-L1-10, RPN 448) — that
    unpatchable device status is invisible in the explanation — should be
    highlighted as a design requirement for any production IoMT IDS
    explanation system. The 5 unsafe safe-failure gaps should be listed as
    required pre-deployment fixes. The DO NOT constraint completeness gap
    should be framed as an implementation deficit against a correct spec,
    with the IMP-03 format cited as the target architecture.
