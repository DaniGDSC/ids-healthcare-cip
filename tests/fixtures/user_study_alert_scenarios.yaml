# ================================================================
# user_study_alert_scenarios.yaml
# 20 Alert Scenarios for Phase 2 User Study
# Target: IT Security Generalist at 200-500 bed hospital
# ================================================================
# Ground truth labels are HIDDEN from participants
# Correct actions are used only for scoring
# ================================================================

metadata:
  total_alerts: 20
  alert_types: 5
  per_type: 4
  distribution:
    true_positive: 10
    false_positive: 6
    legitimate_rare: 4
  severity:
    CRITICAL: 3
    HIGH: 7
    MEDIUM: 6
    LOW: 4
  correct_actions:
    isolate: 5
    escalate: 3
    investigate: 5
    monitor: 4
    dismiss: 3

# ================================================================
# TYPE 1 — Anomalous Outbound Connection from Clinical Device
# ================================================================

alerts:

  - alert_id: "A-01"
    type: "T1_outbound_clinical_device"
    order: 1  # randomize before presenting

    ground_truth:
      label: true_positive
      severity: CRITICAL
      correct_action: escalate
      rationale: >
        Infusion pump initiating outbound FTP to unknown external IP
        during active patient care is a confirmed critical threat.
        Escalate immediately — do not isolate without clinical coordination.

    group_a:
      display: |
        ┌──────────────────────────────────────────────┐
        │  ALERT #A-01                                 │
        │  IDS-2847: Outbound FTP — Clinical Subnet    │
        ├──────────────────────────────────────────────┤
        │  Source IP:   10.4.12.8                      │
        │  Dest IP:     203.0.113.42 (external)        │
        │  Protocol:    FTP (port 21)                  │
        │  Timestamp:   02:47:33                       │
        │  Severity:    6.5/10                         │
        └──────────────────────────────────────────────┘

    group_b:
      display: |
        ┌──────────────────────────────────────────────┐
        │  ALERT #A-01                                 │
        │  IDS-2847: Outbound FTP — Clinical Subnet    │
        ├──────────────────────────────────────────────┤
        │  Source IP:   10.4.12.8                      │
        │  Dest IP:     203.0.113.42 (external)        │
        │  Protocol:    FTP (port 21)                  │
        │  Timestamp:   02:47:33                       │
        │  Severity:    6.5/10                         │
        ├──────────────────────────────────────────────┤
        │  WHY ANOMALOUS                               │
        │  This device (BD Alaris pump, ICU Wing 3)    │
        │  normally communicates only with EHR         │
        │  gateway on port 443. At 02:47 AM it         │
        │  initiated outbound FTP to an external IP    │
        │  not on any approved list.                   │
        │  Confidence: HIGH — never observed in        │
        │  120 days for this device class.             │
        ├──────────────────────────────────────────────┤
        │  CLINICAL SEVERITY: CRITICAL                 │
        │  Infusion pump network (ICU Wing 3) —        │
        │  active drug delivery to 8 patients.         │
        │  Compromise could alter infusion             │
        │  parameters. PHI: medication records         │
        │  for current ICU census.                     │
        ├──────────────────────────────────────────────┤
        │  RECOMMENDED ACTION                          │
        │  Apply NAC policy ICU-QUARANTINE-01          │
        │  (blocks outbound non-HTTPS, preserves       │
        │  EHR connectivity).                          │
        │  DO NOT power-cycle pumps during active      │
        │  infusions — coordinate with ICU nurse.      │
        │  Escalate: Clinical Engineering → Security   │
        │  lead → ICU charge nurse.                    │
        │  Act within 15 minutes.                      │
        └──────────────────────────────────────────────┘


  - alert_id: "A-02"
    type: "T1_outbound_clinical_device"
    order: 6

    ground_truth:
      label: legitimate_rare
      severity: LOW
      correct_action: dismiss
      rationale: >
        Scheduled vendor maintenance window for GE CARESCAPE.
        High DNS query volume is normal firmware update check pattern.
        Dismiss after confirming with biomed.

    group_a:
      display: |
        ┌──────────────────────────────────────────────┐
        │  ALERT #A-02                                 │
        │  IDS-3301: Anomaly — Medical Device          │
        ├──────────────────────────────────────────────┤
        │  Source IP:   10.4.20.6                      │
        │  Dest IP:     10.1.1.1 (internal DNS)        │
        │  Protocol:    DNS (port 53, high volume)     │
        │  Timestamp:   09:30:00                       │
        │  Severity:    4.0/10                         │
        └──────────────────────────────────────────────┘

    group_b:
      display: |
        ┌──────────────────────────────────────────────┐
        │  ALERT #A-02                                 │
        │  IDS-3301: Anomaly — Medical Device          │
        ├──────────────────────────────────────────────┤
        │  Source IP:   10.4.20.6                      │
        │  Dest IP:     10.1.1.1 (internal DNS)        │
        │  Protocol:    DNS (port 53, high volume)     │
        │  Timestamp:   09:30:00                       │
        │  Severity:    4.0/10                         │
        ├──────────────────────────────────────────────┤
        │  WHY ANOMALOUS                               │
        │  Patient monitor (GE CARESCAPE, MedSurg)     │
        │  normally sends vitals via HL7 every 30s.    │
        │  Starting 09:30 it began 300+ DNS            │
        │  queries/min — 20x normal volume.            │
        │  Confidence: MEDIUM — could be malware       │
        │  beacon OR firmware update check loop.       │
        ├──────────────────────────────────────────────┤
        │  CLINICAL SEVERITY: MEDIUM                   │
        │  Patient monitoring (MedSurg 2nd floor) —    │
        │  vital signs for 24 beds. Monitor sending    │
        │  vitals normally. If isolated, 24 beds       │
        │  lose automated monitoring.                  │
        ├──────────────────────────────────────────────┤
        │  RECOMMENDED ACTION                          │
        │  Check with Biomed Engineering: was a        │
        │  GE CARESCAPE firmware update scheduled      │
        │  today? If YES: dismiss alert.               │
        │  If NO: rate-limit DNS to 10 queries/min.   │
        │  DO NOT isolate monitor from EHR gateway     │
        │  — vital sign reporting must continue.       │
        │  Verify with biomed within 1 hour.           │
        └──────────────────────────────────────────────┘


  - alert_id: "A-03"
    type: "T1_outbound_clinical_device"
    order: 11

    ground_truth:
      label: true_positive
      severity: HIGH
      correct_action: isolate
      rationale: >
        PACS server initiating HTTPS to unrecognized external IP
        at 4 AM is consistent with data exfiltration staging.
        Isolate outbound connection to unrecognized dest only.

    group_a:
      display: |
        ┌──────────────────────────────────────────────┐
        │  ALERT #A-03                                 │
        │  DLP-0712: Large Outbound Transfer           │
        ├──────────────────────────────────────────────┤
        │  Source IP:   10.1.5.3                       │
        │  Dest IP:     198.51.100.77 (external)       │
        │  Protocol:    HTTPS (port 443)               │
        │  Volume:      2.3 GB                         │
        │  Timestamp:   04:05:00                       │
        │  Severity:    5.5/10                         │
        └──────────────────────────────────────────────┘

    group_b:
      display: |
        ┌──────────────────────────────────────────────┐
        │  ALERT #A-03                                 │
        │  DLP-0712: Large Outbound Transfer           │
        ├──────────────────────────────────────────────┤
        │  Source IP:   10.1.5.3                       │
        │  Dest IP:     198.51.100.77 (external)       │
        │  Protocol:    HTTPS (port 443)               │
        │  Volume:      2.3 GB                         │
        │  Timestamp:   04:05:00                       │
        │  Severity:    5.5/10                         │
        ├──────────────────────────────────────────────┤
        │  WHY ANOMALOUS                               │
        │  PACS archive (10.1.5.3) transferred 2.3 GB  │
        │  outbound at 04:05 AM. Baseline: outbound    │
        │  only to 3 approved radiology partners.      │
        │  Destination 198.51.100.77 is NOT approved.  │
        │  Confidence: MEDIUM — PACS does large        │
        │  transfers legitimately, but this dest       │
        │  is unrecognized.                            │
        ├──────────────────────────────────────────────┤
        │  CLINICAL SEVERITY: HIGH                     │
        │  PACS archive — all diagnostic imaging.      │
        │  No immediate care disruption. Risk: bulk    │
        │  exfiltration of imaging with embedded PHI   │
        │  in DICOM headers. Potentially thousands     │
        │  of studies with patient name, DOB, MRN.     │
        ├──────────────────────────────────────────────┤
        │  RECOMMENDED ACTION                          │
        │  Block PACS outbound to 198.51.100.77 only.  │
        │  Verify with Radiology IT: was a new image-  │
        │  sharing agreement configured recently?      │
        │  DO NOT block all PACS outbound — active     │
        │  radiology reads depend on approved partners. │
        │  Escalate: Security lead → Radiology IT →   │
        │  Privacy Officer.                            │
        │  Act within 30 minutes. Capture NetFlow      │
        │  for PACS past 24 hours.                     │
        └──────────────────────────────────────────────┘


