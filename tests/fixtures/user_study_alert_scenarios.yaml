# ================================================================
# TYPE 3 — Lateral Movement Between Network Segments
# ================================================================

  - alert_id: "A-09"
    type: "T3_lateral_movement"
    order: 3

    ground_truth:
      label: true_positive
      severity: HIGH
      correct_action: isolate
      rationale: >
        Unauthorized host crossing to medical device VLAN via SMB
        is a confirmed lateral movement indicator. Isolate source only —
        preserve authorized biomed workstation access.

    group_a:
      display: |
        ┌──────────────────────────────────────────────┐
        │  ALERT #A-09                                 │
        │  IDS-1933: Cross-VLAN SMB Connection         │
