        │  Dest IP:     10.4.8.22 (MEDICAL-DEVICE)     │
        │  Protocol:    SMB (port 445)                 │
        │  Timestamp:   14:22:11                       │
        │  Severity:    7.0/10                         │
        └──────────────────────────────────────────────┘

    group_b:
      display: |
