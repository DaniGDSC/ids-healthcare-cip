# shap_stubs.yaml
# Stub SHAPContext for offline testing (no model required)
# One stub per alert type — used by test_shap_narrative_alignment (M5)
# Replace with real SHAP output once module4_online_explainer.py is built.

stubs:
  type_1_outbound_clinical_device:
    top_category: "network_destination"
    top_features: ["dest_ip", "protocol", "dest_port"]
    shap_direction: "elevated"
    confidence_from_shap: "HIGH"

  type_2_unauthorized_ehr_access:
    top_category: "user_access_pattern"
    top_features: ["records_accessed", "department_scope", "access_velocity"]
    shap_direction: "elevated"
    confidence_from_shap: "HIGH"

  type_3_lateral_movement:
    top_category: "lateral_movement"
    top_features: ["vlan_crossing", "smb_activity", "new_internal_dest"]
    shap_direction: "elevated"
    confidence_from_shap: "HIGH"

  type_4_data_exfiltration:
    top_category: "exfiltration_signal"
    top_features: ["external_dest", "large_transfer", "compression_detected"]
    shap_direction: "elevated"
    confidence_from_shap: "HIGH"

  type_5_iomt_behavioral_deviation:
    top_category: "device_behavior"
    top_features: ["connection_frequency", "protocol_deviation", "new_connection"]
    shap_direction: "elevated"
    confidence_from_shap: "MEDIUM"
