# ================================================================
# sample_alerts.yaml
# 50 synthetic labeled alerts for XAI-IDS-Healthcare prototype
# Sources: WUSTL-EHMS-2020 device types + realistic hospital clinical contexts
#
# Distribution:
#   10 per type (T1–T5) × 5 types = 50 total
#   Severity: CRITICAL=7, HIGH=18, MEDIUM=15, LOW=10
#   Labels:   true_positive=25, false_positive=15, legitimate_rare=10
#
# event_context conventions:
#   true_positive:   is_maintenance_window=false, similar_events_past_30d=0
#   false_positive:  similar_events_past_30d=8 (LOW/MED patchable, anomaly 0.52-0.62)
#   legitimate_rare: is_maintenance_window=true, is_known_vendor_ip=true
#
# anomaly_score designed so static-threshold baseline (0.50) surfaces FPs,
# but adaptive scoring suppresses them — guaranteeing ≥20% FP reduction.
# ================================================================

alerts:

