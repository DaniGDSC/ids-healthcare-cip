# ================================================================
# mve_specification.yaml — v2.0
# Minimum Viable Explanation (MVE) for XAI-Enhanced IDS
# Target: IT Security Generalist at 200–500 bed hospital
#
# CHANGE LOG vs v1.0:
#   - Layer 1: added shap_context integration rule
#   - Layer 1: added role_authorization_check for EHR access alerts
#   - Layer 1: numeric baseline required for IoMT behavioral deviation
#   - Layer 1: benign-lead framing for LOW-severity known-pattern alerts
#   - Layer 3: EHR access always requires force-reauth regardless of severity
#   - Layer 3: IoMT clinical_constraint must distinguish network vs device action
#   - Layer 3: data_exfiltration must specify exact block scope
#   - Based on: mve_improvement_analysis.yaml IMP-01 through IMP-06
# Updated: 2026-04-14
# ================================================================


# ================================================================
# LAYER SPECIFICATION
# ================================================================

layer_specification:

  layer_1_why_anomalous:
    purpose: "Tell the operator WHY the system flagged this — what normal looks like and how this deviates."
    max_length: "60 words"
    audience: "IT generalist with basic network knowledge"

    required_elements:
      - element: "baseline_behavior"
        description: "What this device/user normally does on the network."
        format: "1 sentence, plain English, names device/user and normal pattern"
        example: "This device (BD Alaris pump, ICU-3) normally communicates only with the EHR gateway on port 443."

      - element: "deviation_description"
        description: >
          What happened differently — the specific trigger.
          If shap_context is provided: MUST mention shap_context.top_category
          and at least 1 of shap_context.top_features (anchored to ML evidence).
          For IoMT behavioral deviation: MUST include numeric baseline comparison
          when volume/rate data is available.
        format: "1 sentence, includes timestamp, protocol, destination"
        example_standard: "At 02:47 AM, it initiated an outbound FTP connection to an external IP (203.0.113.42) not in any approved list."
        example_iomt_numeric: "DNS query rate reached 310 queries/min at 03:12 AM — baseline for this device class is 10–15 queries/min."

      - element: "confidence_indicator"
        description: "How certain the system is that this is truly anomalous."
        format: "'Confidence: HIGH/MEDIUM/LOW — [one-clause justification]'"
        example: "Confidence: HIGH — never observed in 120 days of baseline for this device class."
        low_severity_note: >
          For LOW-severity alerts where destination is internal and pattern
          matches a known benign schedule, lead with the benign hypothesis:
          "Confidence: LOW — pattern consistent with scheduled backup;
          no action required unless destination changes."

      - element: "role_authorization_check"
        alert_types: ["unauthorized_ehr_access"]
        description: >
          Explicit statement of whether the user's role authorizes the access pattern.
          Required for ALL EHR access alerts. If UNCONFIRMED, Layer 3 must recommend
          force-reauth regardless of severity level.
        format: "'Role authorization: CONFIRMED / UNCONFIRMED / DENIED (per HR/AD directory)'"
        example: "Role authorization: UNCONFIRMED — float nurse multi-department access not verified in AD."

    what_NOT_to_include:
      - "Raw SHAP values or feature importance scores (numbers)"
      - "Model architecture details"
      - "Statistical measures (p-values, standard deviations)"
      - "Multiple competing hypotheses"
      - "Anomaly framing for LOW-severity alerts when a benign explanation is available"


  layer_2_clinical_severity:
    purpose: "Translate the technical anomaly into patient-care terms. Answer: 'Wake someone up at 3 AM, or wait until morning?'"
    max_length: "50 words"

    required_elements:
      - element: "affected_system_type"
        format: "[system] ([location]) — [clinical function]"
        example: "Infusion pump network (ICU wing 3) — active drug delivery to 8 patients."

      - element: "patient_care_impact"
        format: "1–2 sentences, names patient count and clinical consequence"
        example: "Compromise could alter infusion parameters affecting 8 ICU patients."

      - element: "phi_exposure_potential"
        format: "1 sentence, names data types and scope"
        example: "PHI at risk: medication records and dosage history for current ICU census."

      - element: "severity_label"
        values: ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
        mapping:
          CRITICAL: "Life-sustaining systems (ventilators, active infusion, surgical) → respond immediately"
          HIGH: "Active clinical care (EHR, active PACS, pharmacy, monitors) → within 1 hour"
          MEDIUM: "Clinical-support not immediately affecting safety (scheduling, archived imaging) → within 4 hours"
          LOW: "Administrative with minimal PHI (guest Wi-Fi, marketing) → within 24 hours"
        note: "Use clinical impact, NOT CVSS scores."

      - element: "severity_rationale"
        format: "1 sentence justifying the label based on clinical impact"

    what_NOT_to_include:
      - "CVSS scores"
      - "Generic 'data breach' language without naming clinical system"


  layer_3_recommended_action:
    purpose: "Tell the operator exactly what to do — with enough specificity to act without further investigation."
    max_length: "60 words"

    required_elements:
      - element: "immediate_action"
        format: "Imperative verb + specific technical step + what it preserves"
        example: "Apply NAC policy ICU-QUARANTINE-01 (blocks outbound non-HTTPS, preserves EHR connectivity)."
        data_exfiltration_note: >
          For data_exfiltration alerts: MUST specify exact scope —
          (a) what is blocked (destination IP only, not full endpoint),
          (b) what is explicitly preserved (approved partner connections, EHR sessions),
          (c) why partial block is preferred over full isolation (care continuity).
          Example: "Block outbound from [source IP] to [dest IP] only.
          DO NOT isolate workstation — active EHR sessions must be preserved."
        ehr_access_note: >
          For ALL unauthorized_ehr_access alerts regardless of severity:
          MUST include force-reauth instruction.
          Severity = urgency, NOT whether action is needed.
          Example: "Disable jsmith's EHR session and force MFA re-authentication.
          [Note: this is required even for LOW-severity access events —
          severity indicates response urgency, not whether action can be skipped.]"

      - element: "clinical_constraint"
        format: "'DO NOT [action] [when/during condition] — [who to coordinate with]'"
        iomt_critical_high_note: >
          For CRITICAL/HIGH IoMT alerts: MUST distinguish between:
          (a) network-layer isolation (safe — does not affect device operation)
          (b) device power-off / physical disconnect (prohibited during active use)
          Example: "DO NOT power off or physically disconnect the ventilator.
          Blocking port 23 at the switch is SAFE and does not affect ventilator operation.
          Contact Biomed Engineering before any physical intervention."
        general_note: >
          The DO NOT statement must specify exactly what action is prohibited,
          not serve as a general warning. Participants must be able to infer
          what they CAN do from the statement.

      - element: "escalation_path"
        format: "Numbered role list"
        example: "1. Clinical Engineering → 2. Security lead → 3. ICU charge nurse"

      - element: "timeframe"
        format: "'Act within [time]. [preservation instruction]'"
        example: "Act within 15 minutes. Preserve EHR audit log before any account changes."

    what_NOT_to_produce:
      - "Vague actions: 'investigate further', 'monitor closely', 'consider isolating'"
      - "Generic escalation without named roles"
      - "Clinical constraint that can be misread as 'take no action'"
      - "Missing force-reauth for any EHR access alert"
      - "Missing action level clarification for CRITICAL/HIGH IoMT alerts"

  totals:
    max_words: 150
    layer_breakdown: "L1 ≤60 + L2 ≤50 + L3 ≤60"


# ================================================================
# SHAP INTEGRATION (new in v2.0)
# ================================================================

shap_integration:
  when_provided:
    description: >
      When shap_context is passed to generate_mve(), Layer 1 deviation_description
      MUST be grounded in SHAP evidence. This anchors the explanation to ML output,
      not just rule-based templates.
    required_behavior:
      - "Mention shap_context.top_category in deviation_description"
      - "Reference at least 1 feature from shap_context.top_features"
      - "Use shap_context.confidence_from_shap as basis for confidence_indicator"
    example_input:
      top_category: "network_destination"
      top_features: ["dest_ip", "protocol", "dest_port"]
      shap_direction: "elevated"
      confidence_from_shap: "HIGH"
    example_layer1_output: >
      "This device (BD Alaris pump, ICU-3) normally communicates only with the
      EHR gateway on port 443. At 02:47 AM, the network destination feature
      (external IP 203.0.113.42, FTP port 21) was the primary anomaly signal —
      never observed in 120 days. Confidence: HIGH."
  when_not_provided:
    description: "Fall back to rule-based deviation description (v1.0 behavior)."

  what_NOT_to_include:
    - "Raw SHAP values (e.g., 'SHAP=0.47 for dest_ip')"
    - "Feature importance scores or model architecture"
    - "Statistical measures"


# ================================================================
# FIVE REFERENCE EXAMPLES (unchanged structure, IMP fixes applied)
# ================================================================

reference_examples:

  example_1_outbound_clinical_device:
    alert_type: "T1 — Anomalous outbound from clinical device"
    ground_truth_severity: "CRITICAL"
    ground_truth_label: "true_positive"
    mve_output:
      layer_1:
        baseline_behavior: "This device (BD Alaris pump, ICU Wing 3) normally communicates only with the EHR gateway on port 443."
        deviation_description: "At 02:47 AM, it initiated an outbound FTP connection to external IP 203.0.113.42 — never seen in 120 days of baseline."
        confidence_indicator: "Confidence: HIGH — FTP to external IP is zero-precedent for this device class."
      layer_2:
        affected_system: "Infusion pump network (ICU Wing 3) — active drug delivery to 8 patients."
        patient_care_impact: "Compromise could alter infusion parameters affecting 8 ICU patients currently receiving medication."
        phi_exposure: "PHI at risk: medication records and dosage history for current ICU census."
        severity_label: "CRITICAL"
        severity_rationale: "Life-sustaining device with active patient delivery cannot be delayed."
      layer_3:
        immediate_action: "Apply NAC policy ICU-QUARANTINE-01 (blocks outbound non-HTTPS, preserves EHR connectivity)."
        clinical_constraint: "DO NOT power-cycle pumps during active infusions. Blocking outbound traffic at the switch is SAFE and does not affect drug delivery. Coordinate with ICU charge nurse before any physical intervention."
        escalation_path: "1. Clinical Engineering → 2. Security lead → 3. ICU charge nurse"
        timeframe: "Act within 15 minutes. Preserve network traffic logs before policy change."

  example_2_unauthorized_ehr_access:
    alert_type: "T2 — Unauthorized EHR access"
    ground_truth_severity: "HIGH"
    ground_truth_label: "true_positive"
    mve_output:
      layer_1:
        baseline_behavior: "User jsmith (Billing, day-shift 08–17) accesses 8–12 Billing module records per day during business hours only."
        deviation_description: "At 23:14, jsmith accessed 47 Cardiology records from a billing workstation — after-hours, cross-department access with zero precedent in 90 days."
        confidence_indicator: "Confidence: HIGH — after-hours clinical-dept access has zero precedent."
        role_authorization_check: "Role authorization: UNCONFIRMED — billing role is not authorized for Cardiology records per HR directory."
      layer_2:
        affected_system: "EHR (Epic) — Cardiology patient records."
        patient_care_impact: "No direct care disruption. Risk: unauthorized PHI viewing or exfiltration by billing staff."
        phi_exposure: "PHI at risk: full records for 47 Cardiology patients (diagnoses, procedures, insurance)."
        severity_label: "HIGH"
        severity_rationale: "Unauthorized access to 47 patient records from an unauthorized role warrants immediate response."
      layer_3:
        immediate_action: "Disable jsmith's EHR session and force MFA re-authentication. [Note: force-reauth is required even for lower-severity EHR access events — severity indicates urgency, not whether action can be skipped.]"
        clinical_constraint: "DO NOT delete jsmith's account — preserve full audit trail for privacy investigation."
        escalation_path: "1. Privacy Officer → 2. HR → 3. Security lead"
        timeframe: "Act within 30 minutes. Preserve EHR audit log before any account changes."

  example_3_lateral_movement:
    alert_type: "T3 — Lateral movement"
    ground_truth_severity: "CRITICAL"
    ground_truth_label: "true_positive"
    mve_output:
      layer_1:
        baseline_behavior: "The EHR application server (10.1.1.20) never initiates outbound connections; it only accepts inbound HTTPS from clinical workstations."
        deviation_description: "At 14:22, it initiated an SMB port scan toward 10.4.8.0/24 (Medical Device VLAN) — this server has never generated outbound traffic in 180 days."
        confidence_indicator: "Confidence: HIGH — outbound scan from an inbound-only server is a definitive behavioral anomaly."
      layer_2:
        affected_system: "EHR server + Medical Device VLAN — clinical device network segment."
        patient_care_impact: "If EHR server is compromised, lateral movement to clinical device VLAN could affect IoMT devices on active patient floors."
        phi_exposure: "PHI at risk: full EHR database and all connected clinical devices."
        severity_label: "CRITICAL"
        severity_rationale: "Potential compromise of EHR server with reach to patient-connected IoMT devices."
      layer_3:
        immediate_action: "Isolate 10.1.1.20 from the Medical Device VLAN by applying ACL block at the core switch. Preserve EHR connectivity to clinical workstations on separate VLAN."
        clinical_constraint: "DO NOT take EHR server offline during active clinical shifts — apply network-layer VLAN isolation only, not server shutdown."
        escalation_path: "1. Security lead → 2. Clinical Engineering → 3. On-call physician (if device VLAN affected)"
        timeframe: "Act within 10 minutes. Capture full packet trace before isolation."

  example_4_data_exfiltration:
    alert_type: "T4 — Data exfiltration"
    ground_truth_severity: "HIGH"
    ground_truth_label: "true_positive"
    mve_output:
      layer_1:
        baseline_behavior: "The lab information system (LIS-SERVER, 10.5.2.3) normally transfers data only to internal lab partners via SFTP to approved IPs."
        deviation_description: "At 16:33, it initiated a 340 MB SFTP transfer to external IP 185.220.101.42 — not on any approved destination list."
        confidence_indicator: "Confidence: HIGH — external SFTP destination has zero precedent in 90 days."
      layer_2:
        affected_system: "Lab Information System — patient lab results and diagnostic data."
        patient_care_impact: "Potential exfiltration of lab results. No direct care disruption, but PHI breach if confirmed."
        phi_exposure: "PHI at risk: lab results, diagnostic codes, and patient identifiers for all patients processed today."
        severity_label: "HIGH"
        severity_rationale: "Active data transfer to unknown external destination requires immediate containment."
      layer_3:
        immediate_action: "Block outbound traffic from 10.5.2.3 to 185.220.101.42 only (destination-specific ACL). DO NOT isolate the LIS server — active connections to internal lab partners and EHR must be preserved for patient care continuity."
        clinical_constraint: "DO NOT shut down LIS server during active lab processing. Apply destination-specific block at the firewall only."
        escalation_path: "1. Security lead → 2. Privacy Officer → 3. Lab Director"
        timeframe: "Act within 20 minutes. Preserve SFTP transfer logs and session metadata."

  example_5_iomt_behavioral_deviation:
    alert_type: "T5 — IoMT device behavioral deviation"
    ground_truth_severity: "MEDIUM"
    ground_truth_label: "true_positive"
    mve_output:
      layer_1:
        baseline_behavior: "This patient monitor (GE CARESCAPE B450, MedSurg 2nd floor) generates 10–15 DNS queries per minute during normal operation."
        deviation_description: "At 03:12 AM, DNS query rate reached 310 queries/min — 20× above baseline. This rate is consistent with firmware update loops or C2 beaconing."
        confidence_indicator: "Confidence: MEDIUM — DNS volume anomaly detected; benign firmware update and C2 beaconing are both plausible explanations requiring investigation."
      layer_2:
        affected_system: "Patient monitor (MedSurg 2nd floor) — vital signs monitoring for 6 patients."
        patient_care_impact: "Device remains operational. Sustained DNS flooding may degrade monitoring performance or indicate C2 channel establishment."
        phi_exposure: "PHI at risk: patient vital signs data if device is compromised."
        severity_label: "MEDIUM"
        severity_rationale: "Device is operational but anomalous DNS behavior warrants investigation before escalation."
      layer_3:
        immediate_action: "Rate-limit DNS from 10.4.15.8 at the network switch (cap at 50 queries/min). This preserves device connectivity while throttling anomalous traffic."
        clinical_constraint: "DO NOT isolate or power off the monitor — 6 patients are actively monitored. Rate-limiting DNS at the switch does not affect vital signs data transmission."
        escalation_path: "1. Biomed Engineering → 2. Security lead"
        timeframe: "Act within 4 hours. Contact Biomed to verify if a firmware update was scheduled."


# ================================================================
# ACCEPTANCE CRITERIA (unchanged from v1.0 except M5 added)
# ================================================================

acceptance_tests:
  - test_mve_completeness           # M1: all 3 layers, all required elements
  - test_layer1_length_constraint   # M1b: L1≤60, L2≤50, L3≤60, total≤150
  - test_clinical_relevance         # M2: correct clinical system + patient impact
  - test_actionability              # M3: specific executable action (not vague)
  - test_clinical_constraint_awareness  # M4: DO NOT present for clinical alerts
  - test_shap_narrative_alignment   # M5 NEW: Layer 1 anchored to shap_context when provided
  - test_severity_label_accuracy    # M8: exact match, 0 CRITICAL↔LOW mismatches

must_not:
  - "Include raw SHAP values, feature importances, or model architecture in output text"
  - "Use CVSS scores as severity labels"
  - "Produce vague recommendations ('investigate further', 'monitor closely', 'consider isolating')"
  - "Omit DO NOT statement when alert involves clinical systems"
  - "Claim detection of RF/proprietary wireless protocol attacks"
  - "Allow force-reauth to be skipped for any EHR access alert regardless of severity"
  - "Use ambiguous clinical constraint that can be misread as 'take no hardware action at all'"