[project]
name = "ids-healthcare-cip"
version = "2.0.0"
description = "Healthcare IoMT Intrusion Detection System — IEEE Q1 research"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.bandit]
# Bandit exclusions are limited to test directories. The legacy
# src/phase*_*/phase*/tests/ paths were removed because the entire
# src/ tree was a stale parallel copy of pipeline/; the canonical
# code lives under pipeline/.
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
# Tests live under each pipeline module's own tests/ directory once
# they exist. The legacy src/phase*/.../tests/ paths were removed
# because none of them ever existed on disk — pytest now collects
# from any tests/ directory under pipeline/.
testpaths = ["tests", "pipeline"]
addopts = "-v --tb=short"
