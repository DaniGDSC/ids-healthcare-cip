dashboard_map:
  entry_point: "pipeline/module6_evaluation/module6_app.py"
  run_command: "streamlit run pipeline/module6_evaluation/module6_app.py"

  pages:
    - name: "Dashboard"
      file: "pipeline/module6_evaluation/module6_app.py (dashboard_mode)"
      purpose: "Real-time overview with risk gauge, alert feed, SHAP waterfall, clinician NLG panel, response recommendations, and global feature importance."
      data_sources:
        - "results/reports/evaluation_alerts.json"
        - "results/reports/alert_responses.json"
        - "results/reports/risk_scores.npz"
        - "results/reports/admin_dashboard.json"
        - "results/reports/clinician_summaries.json"
        - "results/reports/response_policy.json"
        - "results/charts/waterfall_xgboost_sample_*.png"
        - "results/charts/force_xgboost_sample_*.png"
        - "results/charts/global_importance_xgboost.png"
        - "results/charts/beeswarm_xgboost.png"
      iomt_alert_display: true
      has_triage_workflow: false
      interactive_components:
        - "st.sidebar.toggle (auto-refresh 30s)"
        - "st.selectbox (select alert)"
        - "st.metric (5x summary: total, CRITICAL, HIGH, MEDIUM, LOW)"
        - "st.bar_chart (tier distribution)"
        - "st.bar_chart (risk heatmap by attack category)"
        - "st.progress (risk score gauge)"
        - "st.dataframe (alert feed table, top 15)"
        - "st.image (SHAP waterfall, force plot, global importance, beeswarm)"
      status: "COMPLETE"

    - name: "Online Simulation"
      file: "pipeline/module6_evaluation/module6_app.py (simulation_mode)"
      purpose: "Stream test samples through pipeline with playback controls, role-based views, latency profiling, adaptive threshold monitoring, drift detection, and FDA-style audit record export."
      data_sources:
        - "results/reports/alert_responses.json"
        - "results/reports/clinician_summaries.json"
        - "results/reports/audit_trail.json"
        - "results/reports/online_latency_profile.json"
        - "results/reports/dynamic_threshold_results.json"
        - "results/reports/drift_detection_results.json"
        - "data/processed/test_phase1.parquet"
        - "results/charts/waterfall_xgboost_sample_*.png"
        - "results/charts/force_xgboost_sample_*.png"
        - "results/charts/global_importance_xgboost.png"
        - "results/charts/beeswarm_xgboost.png"
        - "results/charts/threshold_over_time.png"
        - "results/charts/drift_psi.png"
      iomt_alert_display: true
      has_triage_workflow: true
      interactive_components:
        - "st.sidebar.selectbox (role switcher: Security Analyst / Clinician / Administrator)"
        - "st.sidebar.toggle (show render time)"
        - "st.sidebar.toggle (log render time to JSONL)"
        - "st.sidebar.radio (data source: pre-computed alerts vs live parquet)"
        - "st.selectbox (playback speed: 0.5x / 1x / 2x / 4x)"
        - "st.button (Pause / Resume)"
        - "st.button (Step — advance one alert)"
        - "st.button (Reset)"
        - "st.number_input (Jump to alert #)"
        - "st.button (Confirm — per alert)"
        - "st.button (Reject — per alert)"
        - "st.text_input (feedback note — per alert)"
        - "st.download_button (Export FDA-style Audit Record — per alert)"
        - "st.expander (per-alert detail with role-based view)"
        - "st.line_chart (cumulative tier distribution)"
        - "st.line_chart (rolling per-sample latency)"
        - "st.bar_chart (per-stage mean latency)"
        - "st.dataframe (percentile table per stage)"
        - "st.metric (adaptive threshold F1: static vs adaptive)"
        - "st.metric (drift events, PSI max)"
      status: "COMPLETE"

    - name: "Browse Alerts"
      file: "pipeline/module6_evaluation/module6_app.py (browse_mode)"
      purpose: "Free-form browsing of evaluation alerts with toggle to show/hide XAI explanations (SHAP features, DAE anomalies, consensus, clinician summary, waterfall chart)."
      data_sources:
        - "results/reports/evaluation_alerts.json"
        - "results/charts/waterfall_xgboost_sample_*.png"
      iomt_alert_display: true
      has_triage_workflow: false
      interactive_components:
        - "st.sidebar.toggle (Show XAI Explanation)"
        - "st.sidebar.slider (Alert # selector)"
      status: "COMPLETE"

    - name: "Study (A/B)"
      file: "pipeline/module6_evaluation/module6_app.py (study_mode)"
      purpose: "Phase 2 user study with registration, counterbalanced A/B condition (Group A raw IDS vs Group B with MVE), severity/action/confidence capture, scoring, proxy Q21+Q22 questions, and response persistence."
      data_sources:
        - "tests/fixtures/user_study_alert_scenarios.yaml"
      iomt_alert_display: true
      has_triage_workflow: true
      interactive_components:
        - "st.form (registration: participant ID, role, years, IDS experience, consent)"
        - "st.text_input (participant ID)"
        - "st.selectbox (role)"
        - "st.slider (years in role)"
        - "st.radio (IDS/SIEM experience)"
        - "st.checkbox (consent)"
        - "st.progress (alert progress bar)"
        - "st.code (alert display — Group A or Group B)"
        - "st.form (per-alert response)"
        - "st.radio (severity: CRITICAL / HIGH / MEDIUM / LOW)"
        - "st.radio (action: isolate / escalate / investigate / monitor / dismiss)"
        - "st.select_slider (confidence 1-5)"
        - "st.form (proxy questions Q21 + Q22)"
        - "st.radio (Q21 clinical clarity)"
        - "st.text_input (Q21 note)"
        - "st.radio (Q22 management justification)"
        - "st.text_input (Q22 note)"
      status: "COMPLETE"

    - name: "PCAP Replay"
      file: "pipeline/module6_evaluation/module6_app.py (pcap_replay_stub)"
      purpose: "Placeholder for future PCAP file upload and live packet-to-alert pipeline replay."
      data_sources: []
      iomt_alert_display: false
      has_triage_workflow: false
      interactive_components:
        - "st.file_uploader (disabled — .pcap/.pcapng upload)"
      status: "PLACEHOLDER"

  data_flow:
    reads_from:
      - "results/reports/evaluation_alerts.json"
      - "results/reports/alert_responses.json"
      - "results/reports/risk_scores.npz"
      - "results/reports/admin_dashboard.json"
      - "results/reports/clinician_summaries.json"
      - "results/reports/response_policy.json"
      - "results/reports/audit_trail.json"
      - "results/reports/online_latency_profile.json"
      - "results/reports/dynamic_threshold_results.json"
      - "results/reports/drift_detection_results.json"
      - "data/processed/test_phase1.parquet"
      - "tests/fixtures/user_study_alert_scenarios.yaml"
      - "results/charts/*.png (waterfall, force, global importance, beeswarm, threshold, PSI)"
    writes_to:
      - "results/reports/audit_trail.jsonl (AuditTrailWriter — hash-chained interaction log)"
      - "results/reports/audit_log.jsonl (HardenedAuditLogger — signed reviewer-attributed log)"
      - "results/reports/online_interactions.jsonl (online simulation interaction capture)"
      - "results/reports/study_responses_<PID>.json (per-participant study responses)"
      - "/tmp/sim_render_timings.jsonl (optional debug render timing log)"
    anthropic_api_calls: false
    anthropic_api_pages: []

  mve_display:
    layer_1_shown: true
    layer_2_shown: true
    layer_3_shown: true
    severity_label_shown: true
    do_not_constraint_shown: false
    device_criticality_shown: false
    notes: >
      The Study (A/B) page shows Group B alerts as pre-rendered text blocks
      via st.code() which contain the full 3-layer MVE (WHY anomalous,
      CLINICAL SEVERITY, RECOMMENDED ACTION). The content comes from
      user_study_alert_scenarios.yaml group_b_display field. Whether the
      DO NOT constraint and device criticality are included depends on the
      fixture data, not the dashboard code — the dashboard renders whatever
      text is in group_b_display verbatim. The Dashboard and Online Simulation
      pages display clinician summaries (NLG text), SHAP features, risk
      levels/scores, and recommended actions, but do not explicitly split
      these into the MVE 3-layer format. The Browse Alerts page shows XAI
      features, DAE anomaly indicators, consensus text, and clinician summary
      but again not as explicit Layer 1/2/3 sections.

  session_state_keys:
    - "participant_id"
    - "participant_role"
    - "participant_years"
    - "participant_ids_exp"
    - "current_alert"
    - "responses"
    - "alert_start_time"
    - "study_started"
    - "study_complete"
    - "study_alerts"
    - "ab_conditions"
    - "app_mode"
    - "sim_index"
    - "sim_running"
    - "sim_history"
    - "sim_speed"
    - "sim_source"
    - "latency_history"
    - "sim_role"
    - "proxy_done"
    - "_latency_rng"
    - "_render_caption_enabled"
    - "_render_log_enabled"
    - "_render_ms_history"
    - "_last_playhead_ms"
    - "_processed_alerts"
    - "_fda_payload_cache"
    - "_fda_filename_cache"
    - "_tier_history"
    - "_live_preview_cache"

  gaps_and_todos:
    - "PCAP Replay page is a stub — file uploader is disabled, no processing logic implemented."
    - "DO NOT constraint from MVE Layer 3 is not explicitly rendered or enforced by dashboard code; presence depends entirely on the fixture YAML content in group_b_display."
    - "Device criticality tier is not displayed as a distinct labeled field in any view; it is embedded in the NLG clinician summary text when available."
    - "No Anthropic API calls from dashboard — all explanations are pre-computed. LLM-generated MVE is done offline in the pipeline, not at dashboard render time."
    - "Dashboard mode has no triage workflow — it is read-only display. Only Online Simulation and Study (A/B) capture user decisions."
    - "Browse Alerts page does not capture any user responses or decisions — purely passive browsing."

  overall_status: "PARTIAL"
  assessment: >
    The dashboard is a substantial, well-structured Streamlit application with 5
    navigation modes. Four of five modes are fully implemented: Dashboard provides
    a rich real-time overview with risk gauge, alert feed, SHAP waterfall, NLG
    clinician panel, and response recommendations; Online Simulation adds playback
    controls, role-based views (analyst/clinician/admin), latency profiling,
    adaptive threshold and drift monitoring, and FDA audit record export; Browse
    Alerts enables XAI-toggled alert inspection; and Study (A/B) implements the
    full Phase 2 user study workflow with registration, counterbalanced A/B
    conditions, severity/action/confidence capture, composite scoring, proxy Q21+Q22
    questions, and per-participant response persistence. The only incomplete page is
    PCAP Replay (stub). However, the dashboard does not explicitly render MVE output
    in the research-specified 3-layer format (WHY/SEVERITY/ACTION with DO NOT
    constraint) — it relies on pre-rendered text blocks and NLG summaries. To fully
    demonstrate the research claims from mve_specification.yaml, the Study (A/B)
    page would need to be verified against real fixture data to confirm Layer 3
    constraints are present in group_b_display.

  supporting_files:
    - file: "pipeline/module6_evaluation/module6_evaluation.py"
      purpose: "Builds evaluation artifacts (curate 20 alerts, generate simulated responses, compute metrics). Not part of the dashboard but produces the JSON/NPZ data it consumes."
    - file: "pipeline/module6_evaluation/study_loader.py"
      purpose: "Loads user_study_alert_scenarios.yaml into AlertScenario dataclasses and assigns A/B conditions. Imported by study_mode()."
    - file: "pipeline/module6_evaluation/study_analysis.py"
      purpose: "Post-study M5 analysis: Mann-Whitney U test on composite accuracy, secondary metrics (over/under-reaction, catastrophic miss, Q21/Q22 proxy). Not called by dashboard — run separately."
    - file: "orchestrate.py"
      purpose: "Multi-agent pipeline orchestrator (BA/Arch/Dev/Sec/QA/PM/Writer/DevOps). References module6_app.py for deployment readiness checks but does not run the dashboard."
