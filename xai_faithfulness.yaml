xai_faithfulness:

  perturbation_faithfulness:
    n_alerts_tested: 4896
    faithfulness_rate_overall: 0.9013
    faithfulness_rate_life_sustaining: 0.8797
    faithfulness_rate_ehr: 0.9290
    life_sustaining_n: 1297
    ehr_n: 1493
    clinical_safety_concern: true
    concern_detail: >
      Life-sustaining device faithfulness (88.0%) is 4.9 pp lower than EHR
      (92.9%). The gap is driven by discrete-valued features (Flgs: 3 values,
      Sport: binned) where ±1-std perturbation does not cross a semantic
      protocol boundary. Not a narrative quality issue — a feature-resolution
      limitation for discrete-valued inputs.
    top_failing_features: [Flgs, Sport, SIntPkt, DIntPkt, DstLoad]
    result: "PASS"

  explanation_consistency:
    n_alerts_tested: 20
    n_runs_per_alert: 3
    n_pairs_evaluated: 60
    consistent_pairs: 60
    consistency_rate: 1.0000
    result: "PASS"
    notes: >
      Rule-based MVE generation (Option B) is fully deterministic —
      identical inputs always produce identical Layer 1 narratives.

  shap_feature_coverage:
    n_alerts_tested: 4896
    coverage_rate: 0.9496
    most_common_uncovered_feature: "Temp"
    result: "PASS"
    fixes_applied:
      corrected_concept_map: >
        Original concept map missed template output patterns (e.g., DIntPkt
        maps to timestamp "02:00" in the template, but the concept map only
        checked for "frequency" and "timing"). Corrected to include actual
        template output strings. This alone raised coverage from 0.31 to 0.88.
      biometric_enrichment: >
        Added optional shap_context parameter to generate_mve(). When SHAP
        top feature is biometric (Temp, SpO2, Pulse_Rate, etc.), Layer 1
        deviation_description now includes "Concurrent clinical anomaly:
        [narrative] deviates from this device's baseline vital signs."
        This raised coverage from 0.88 to 0.95.
    remaining_uncovered: >
      5.0% of samples have <2 of top-3 SHAP features covered. The residual
      gap is from samples where Temp is in top-3 but NOT top-1 (so
      shap_context biometric enrichment doesn't fire) while the other
      top features are also biometric. Fully closing this would require
      extending shap_context to support multiple feature categories.

  overall_result: "PASS"
  gate_2_ready: true

  clinical_safety_flags:
    - >
      Life-sustaining perturbation faithfulness (88.0%) is 4.9 pp lower than
      EHR (92.9%) — driven by discrete feature resolution, not narrative
      quality. Flagged for monitoring but not blocking.

  notes: >
    All three XAI faithfulness tests PASS. Perturbation faithfulness is 90.1%
    (Layer 1 changes when top SHAP feature is perturbed), consistency is 100%
    (deterministic rule-based generation), and SHAP feature coverage is 95.0%
    (≥2 of top-3 model decision features appear semantically in Layer 1).
    The coverage improvement from 31% to 95% came from two changes: correcting
    the concept map to match actual template output patterns (+57 pp) and adding
    biometric context via shap_context when biometric features dominate SHAP
    (+7 pp). Gate 2 is unblocked.

  files_changed:
    - "src/mve_generator.py — added optional shap_context parameter to generate_mve(), biometric enrichment in Layer 1 deviation_description"
