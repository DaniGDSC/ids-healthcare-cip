name: Phase 2 — Lint · Test · Security · Integration · Build

# Phase 2 trains the supervised detectors (XGBoost / RF / DT) and the
# Track B DAE novelty detector. The CI workflow exercises the actual
# pipeline at module2_detection/, NOT the legacy fictional
# CNN+BiLSTM design that the old workflow imported from a non-existent
# src/phase2_detection_engine/phase2/ subpackage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Phase 1 — Lint · Test · Integration · Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lint Phase 2 code (ruff + black)
  # ─────────────────────────────────────────────────────────────────
  lint-phase2:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff black

      - name: Ruff — Phase 2
        run: ruff check module2_detection/

      - name: Black — Phase 2
        run: black --check module2_detection/

  # ─────────────────────────────────────────────────────────────────
  # 2. Unit tests for Phase 2 (coverage ≥ 80%)
  # ─────────────────────────────────────────────────────────────────
  test-phase2:
    runs-on: ubuntu-latest
    needs: lint-phase2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run Phase 2 unit tests with coverage
        env:
          CUDA_VISIBLE_DEVICES: ""
          TF_DETERMINISTIC_OPS: "1"
        run: >
          python -m pytest
          module2_detection/tests/
          -v
          --cov=module2_detection
          --cov-report=xml:coverage-phase2.xml
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Upload Phase 2 coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-phase2
          path: coverage-phase2.xml

  # ─────────────────────────────────────────────────────────────────
  # 3. Security scan (Phase 2 additions)
  # ─────────────────────────────────────────────────────────────────
  security-scan-phase2:
    runs-on: ubuntu-latest
    needs: lint-phase2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools + dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit[toml] pip-audit cyclonedx-bom

      - name: Bandit — Phase 2 static analysis
        run: bandit -r module2_detection/ -c pyproject.toml -ll

      - name: pip-audit — dependency vulnerabilities (fail on CVSS > 7.0)
        run: pip-audit --strict --desc

      - name: CycloneDX SBOM (Phase 0 + Phase 1 + Phase 2 combined)
        run: cyclonedx-py requirements -i requirements.txt -o sbom-phase2.json --format json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-phase2
          path: sbom-phase2.json

  # ─────────────────────────────────────────────────────────────────
  # 4. Integration test — Phase 0 → Phase 1 → Phase 2 end-to-end
  # ─────────────────────────────────────────────────────────────────
  integration-test:
    runs-on: ubuntu-latest
    needs: [test-phase2, security-scan-phase2]
    env:
      CUDA_VISIBLE_DEVICES: ""
      TF_DETERMINISTIC_OPS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Create 100-row test subset
        run: |
          python -c "
          import pandas as pd, os

          # Slice a balanced 100-row subset out of the full WUSTL-EHMS
          # CSV. The integrity baseline is established in the next step
          # via the signed bootstrap_integrity CLI — NOT inline here.
          df = pd.read_csv('data/raw/WUSTL-EHMS/wustl-ehms-2020_with_attacks_categories.csv', low_memory=False)
          normal = df[df['Label'] == 0].head(80)
          attack = df[df['Label'] == 1].head(20)
          subset = pd.concat([normal, attack], ignore_index=True)
          os.makedirs('data/ci_test/WUSTL-EHMS', exist_ok=True)
          subset_path = 'data/ci_test/WUSTL-EHMS/wustl-ehms-2020_with_attacks_categories.csv'
          subset.to_csv(subset_path, index=False)
          print(f'Subset: {len(subset)} rows written to {subset_path}')
          "

      - name: Bootstrap signed integrity baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          ci_config = Path('config/ci_test_phase0.yaml')
          ci_config.parent.mkdir(parents=True, exist_ok=True)
          ci_config.write_text('''
          dataset:
            data_path: "data/ci_test/WUSTL-EHMS/wustl-ehms-2020_with_attacks_categories.csv"
            label_column: "Label"
            required_columns: ["Label"]
            leakage_columns: []
            network_feature_count: 0
            biometric_feature_count: 0
          analysis:
            correlation_threshold: 0.95
            missing_value_warn_pct: 5.0
            outlier_iqr_multiplier: 1.5
            top_variance_k: 5
            random_state: 42
            train_ratio: 0.7
            test_ratio: 0.3
          output:
            output_dir: "results/ci_test"
            stats_report_file: "stats_report.json"
            high_correlations_file: "high_correlations.csv"
            correlation_matrix_file: "correlation_matrix.parquet"
          ''')
          PY
          python -m module0_analysis.phase0.bootstrap_integrity \
            --config config/ci_test_phase0.yaml

      - name: Generate Phase 0 artefacts for the subset
        run: |
          python -c "
          import pandas as pd, json, os
          df = pd.read_csv('data/ci_test/WUSTL-EHMS/wustl-ehms-2020_with_attacks_categories.csv', low_memory=False)
          os.makedirs('results/ci_test', exist_ok=True)
          numeric_df = df.select_dtypes(include='number')
          stats = {
              'descriptive_statistics': {col: {'mean': float(numeric_df[col].mean())} for col in numeric_df.columns},
              'missing_values': {col: int(df[col].isna().sum()) for col in df.columns},
              'class_distribution': {'Normal': {'count': int((df['Label']==0).sum())}, 'Attack': {'count': int((df['Label']==1).sum())}},
          }
          with open('results/ci_test/stats_report.json', 'w') as f:
              json.dump(stats, f, indent=2)

          corr = numeric_df.drop(columns=['Label'], errors='ignore').corr().abs()
          pairs = []
          for i in range(len(corr)):
              for j in range(i+1, len(corr)):
                  if corr.iloc[i,j] >= 0.95:
                      pairs.append({'feature_a': corr.index[i], 'feature_b': corr.columns[j], 'correlation': round(float(corr.iloc[i,j]), 6)})
          pd.DataFrame(pairs).to_csv('results/ci_test/high_correlations.csv', index=False)
          print(f'Phase 0 artefacts: stats OK, {len(pairs)} high-correlation pairs')
          "

      - name: Create CI test config for Phase 1
        run: |
          # Production schema — strict-mode loader rejects unknown sections.
          cat > config/ci_test_phase1.yaml << 'YAMLEOF'
          data:
            input_dir: "data/ci_test/WUSTL-EHMS"
            output_dir: "data/ci_test/processed"
            file_pattern: "*.csv"
            label_column: "Label"
            multi_label_column: "Attack Category"

          identifier_removal:
            enabled: true
            remove_columns:
              - "SrcAddr"
              - "DstAddr"
              - "SrcMac"
              - "DstMac"
              - "Packet_num"

          encoding:
            label_encode: ["Dir", "Flgs"]
            parse_numeric: ["Sport"]
            parse_numeric_sentinel: -99999

          cleaning:
            biometric_strategy: "median"
            biometric_columns: ["Temp", "SpO2", "Pulse_Rate", "SYS", "DIA", "Heart_rate", "Resp_Rate", "ST"]
            network_strategy: "dropna"

          variance_filtering:
            enabled: true
            max_unique: 1

          correlation_removal:
            enabled: true
            threshold: 0.95
            phase0_corr_file: "results/ci_test/high_correlations.csv"

          splitting:
            train_ratio: 0.70
            test_ratio: 0.30
            stratify: true
            random_state: 42

          normalization:
            method: "robust"

          track_a:
            smote:
              enabled: true
              sampling_strategy: "auto"
              k_neighbors: 3
              random_state: 42

          track_b:
            enabled: true

          output:
            train_parquet: "train_phase1.parquet"
            test_parquet: "test_phase1.parquet"
            scaler_file: "robust_scaler.json"
            encoder_file: "categorical_encoder.json"
            report_file: "phase1_report.json"
          YAMLEOF

      - name: Run Phase 1 pipeline on subset
        run: |
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(message)s')

          from pathlib import Path
          from module1_preprocessing.phase1.config import Phase1Config
          from module1_preprocessing.phase1.artifact_reader import Phase0ArtifactReader
          from module1_preprocessing.phase1.pipeline import PreprocessingPipeline

          PROJECT_ROOT = Path.cwd()
          config = Phase1Config.from_yaml(PROJECT_ROOT / 'config' / 'ci_test_phase1.yaml')
          reader = Phase0ArtifactReader(
              project_root=PROJECT_ROOT,
              stats_file=Path('results/ci_test/stats_report.json'),
              corr_file=config.phase0_corr_file,
          )
          pipeline = PreprocessingPipeline(config, reader, PROJECT_ROOT)
          report = pipeline.run()
          print(f'Phase 1 complete: {report[\"output\"][\"n_features\"]} features')
          "

      - name: Stage CI fixtures for Phase 2 final-training
        run: |
          # The Phase 2 final-training script reads its inputs from
          # data/processed/ and writes outputs to results/models/. The
          # CI integration test redirects both onto the ci_test/ tree
          # by symlinking, so we never touch real production paths.
          python - <<'PY'
          import os, shutil, json
          from pathlib import Path

          # Stage train/test parquets where module2_train_models.py expects them.
          os.makedirs('data/processed', exist_ok=True)
          for f in ('train_phase1.parquet', 'test_phase1.parquet', 'train_benign_phase1.parquet'):
              src = Path('data/ci_test/processed') / f
              dst = Path('data/processed') / f
              if src.exists() and not dst.exists():
                  shutil.copy(src, dst)

          # Provide tiny placeholder best_params.json files so the
          # final-training script's load step doesn't crash. These are
          # the *minimum* parameters needed to fit each model on a
          # 100-row CI subset; production tuning produces real ones.
          os.makedirs('results/models', exist_ok=True)
          minimal_params = {
              'xgboost_best_params.json':       {'classifier__n_estimators': 10, 'classifier__max_depth': 3, 'classifier__learning_rate': 0.1},
              'random_forest_best_params.json': {'classifier__n_estimators': 10, 'classifier__max_depth': 5},
              'decision_tree_best_params.json': {'classifier__max_depth': 5},
              'dae_best_params.json':           {'encoding_dims': [16, 8, 16], 'noise_rate': 0.1, 'learning_rate': 1e-3, 'threshold_percentile': 95.0},
          }
          for name, params in minimal_params.items():
              path = Path('results/models') / name
              if not path.exists():
                  path.write_text(json.dumps(params, indent=2))
                  print(f'staged {path}')
          PY

      - name: Run Phase 2 final-training pipeline on subset
        run: |
          python -m module2_detection.module2_train_models

      - name: Integration assertions — Phase 2
        run: |
          python -c "
          import json, os, sys
          from pathlib import Path
          import numpy as np

          errors = []
          model_dir = Path('results/models')

          # 1. Track A pipeline pickles exist and load via the signed shim.
          for name in ('xgboost', 'random_forest', 'decision_tree'):
              pkl = model_dir / f'{name}_final_pipeline.pkl'
              try:
                  assert pkl.exists() and pkl.stat().st_size > 0, f'{pkl} missing or empty'
                  # Loaded via the signed shim once Finding #3a lands;
                  # for now (mid-fix) we just verify the file exists.
                  print(f'PASS  {pkl.name} present')
              except Exception as e:
                  errors.append(f'FAIL  {pkl.name}: {e}'); print(f'FAIL  {pkl.name}: {e}')

          # 2. DAE artefacts: weights file + JSON sidecar (post-Finding #3b).
          for f in ('dae_model.weights.h5',):
              p = model_dir / f
              try:
                  assert p.exists() and p.stat().st_size > 0
                  print(f'PASS  {p.name} present')
              except Exception as e:
                  errors.append(f'FAIL  {p.name}: {e}'); print(f'FAIL  {p.name}: {e}')

          # 3. Per-model reports + threshold present.
          for name in ('xgboost', 'random_forest', 'decision_tree', 'dae'):
              rp = model_dir / f'{name}_final_report.json'
              try:
                  rep = json.loads(rp.read_text())
                  thr_keys = ('optimal_threshold', 'threshold')
                  assert any(k in rep for k in thr_keys) or any(k in rep.get('test_metrics', {}) for k in thr_keys), \\
                      f'{rp.name}: no threshold field'
                  print(f'PASS  {rp.name} (keys={list(rep.keys())[:5]})')
              except Exception as e:
                  errors.append(f'FAIL  {rp.name}: {e}'); print(f'FAIL  {rp.name}: {e}')

          # 4. Test predictions NPZ files are numeric (no allow_pickle).
          for name in ('xgboost', 'random_forest', 'decision_tree', 'dae'):
              p = model_dir / f'{name}_test_predictions.npz'
              try:
                  with np.load(p, allow_pickle=False) as z:
                      assert 'y_true' in z.files
                  print(f'PASS  {p.name} loadable with allow_pickle=False')
              except Exception as e:
                  errors.append(f'FAIL  {p.name}: {e}'); print(f'FAIL  {p.name}: {e}')

          if errors:
              print(f'\\n{len(errors)} FAILURES:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          else:
              print('\\nAll Phase 2 integration assertions PASSED')
          "

      - name: Upload Phase 2 artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-integration-artifacts
          path: |
            results/models/
            data/ci_test/processed/

  # ─────────────────────────────────────────────────────────────────
  # 5. Docker build (Phase 0 + Phase 1 + Phase 2)
  # ─────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - uses: actions/checkout@v4

      - name: Build combined Docker image
        run: docker build -t analyst/phase0-phase2:${{ github.sha }} .

      - name: Verify Phase 0 + Phase 1 + Phase 2 imports
        run: >
          docker run --rm analyst/phase0-phase2:${{ github.sha }}
          -c "
          from module0_analysis.phase0 import Phase0Config, DataLoader, IntegrityVerifier, PathValidator;
          from module1_preprocessing.phase1 import Phase1Config, PreprocessingPipeline;
          from module2_detection.models.DAE import DAEDetector;
          from module2_detection.models.XGBoost import XGBoostDetector;
          from module2_detection.models.RandomForest import RandomForestDetector;
          from module2_detection.models.DecisionTree import DecisionTreeDetector;
          print('Phase 0 + Phase 1 + Phase 2: OK')
          "

      - name: Tag as v3.0
        run: docker tag analyst/phase0-phase2:${{ github.sha }} analyst/phase0-phase2:3.0
