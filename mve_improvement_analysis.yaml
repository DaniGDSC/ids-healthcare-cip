# ================================================================
# mve_improvement_analysis.yaml
# Post-hoc analysis of simulation study responses (A/B)
# Purpose: Identify MVE design gaps and actionable improvements
#          before paper writing (Priority 7)
# Generated from: study_responses_A.json + study_responses_B.json
# n = 500 Group A (control) + 500 Group B (treatment)
# ================================================================

study_summary:
  group_a_composite_accuracy: 0.352
  group_b_composite_accuracy: 0.566
  relative_improvement: 0.608
  m5_verdict: "PASS"


# ================================================================
# DIRECTION 1: MVE GAPS
# Alerts where Group B still performs poorly
# ================================================================

mve_gaps:

  critical_failures:  # Group B accuracy < 50%

    - alert_id: 8
      alert_type: "unauthorized_ehr_access"
      ground_truth_severity: "LOW"
      ground_truth_action: "verify_force_reauth"
      group_b_accuracy: 0.00
      group_a_accuracy: 0.00
      delta: 0.00
      failure_pattern: "sev_right_act_wrong (23/25)"
      observed_behavior: >
        Nearly all participants correctly identified severity as LOW,
        but chose 'monitor' or 'dismiss' instead of 'verify_force_reauth'.
        Group B reasoning: "Physician VPN access seems normal so just monitoring."
      root_cause: >
        MVE Layer 3 does not communicate that force-reauth is standard hygiene
        even for LOW-severity EHR access events. Participants interpret LOW
        severity as "no action needed" rather than "low urgency but still
        requires credential verification."
      improvement_recommendation: >
        Add explicit guidance in Layer 3 for LOW-severity EHR alerts:
        "Even for low-risk access, force re-authentication as standard hygiene —
        this does not constitute a security incident but confirms credential integrity."
        Distinguish between severity (urgency) and required action (always verify EHR access).

    - alert_id: 6
      alert_type: "unauthorized_ehr_access"
      ground_truth_severity: "MEDIUM"
      ground_truth_action: "verify_force_reauth"
      group_b_accuracy: 0.04
      group_a_accuracy: 0.16
      delta: -0.12
      failure_pattern: "both_wrong_near_miss (19/25) — chose LOW + dismiss"
      observed_behavior: >
        Group B unanimously dismissed alert as normal float nurse behavior.
        Reasoning examples: "Float nurse accessing multiple departments is common
        on night shift." "Nurse accessing multiple departments likely normal workflow."
      root_cause: >
        MVE Layer 2 accurately describes the cross-department access pattern but
        does not distinguish between legitimate float nurse activity and unauthorized
        cross-department browsing. Participants apply the 'float nurse' heuristic
        without seeing any signal that role validation is still required.
        This is a REGRESSION vs Group A (4% vs 16%) — MVE is actively misleading here.
      improvement_recommendation: >
        Layer 1 must explicitly state whether the user's role (from asset inventory)
        authorizes multi-department access. Add a field: "Role authorization check:
        CONFIRMED / UNCONFIRMED / DENIED." If UNCONFIRMED, Layer 3 should recommend
        verify_force_reauth regardless of apparent legitimacy. The MVE must not allow
        plausible innocent explanations to suppress action on access events.

  weak_improvements:  # Group B accuracy 32–50%

    - alert_id: 16
      alert_type: "data_exfiltration"
      ground_truth_severity: "HIGH"
      ground_truth_action: "block_destination_preserve_approved"
      group_b_accuracy: 0.32
      group_a_accuracy: 0.28
      delta: 0.04
      failure_pattern: "sev_wrong_act_right (9/25) — over-escalates to CRITICAL + isolate"
      observed_behavior: >
        Many participants correctly escalated but chose CRITICAL severity and
        full endpoint isolation rather than targeted block_destination.
        Reasoning: "1.1 GB in 3 minutes to external IP is almost certainly data theft."
      root_cause: >
        "1.1 GB in 3 minutes" is a strong alarm signal that overrides MVE context.
        Layer 3 recommendation for 'block destination, preserve approved partners'
        is not concrete enough — participants default to full isolation as the
        'safe' choice when the signal feels extreme. The distinction between
        endpoint isolation vs. destination-specific block is not actionable enough.
      improvement_recommendation: >
        Layer 3 must explicitly state the specific NAC/firewall action:
        "Block outbound from [workstation IP] to [external IP] only.
        DO NOT isolate workstation — active sessions to EHR and internal systems
        must be preserved for patient care continuity."
        Include a concrete reason why partial block is preferred over full isolation.

    - alert_id: 18
      alert_type: "iomt_behavioral_deviation"
      ground_truth_severity: "HIGH"
      ground_truth_action: "isolate_contact_biomed"
      group_b_accuracy: 0.44
      group_a_accuracy: 0.24
      delta: 0.20
      failure_pattern: "sev_wrong_act_right (6/25) + both_wrong_near_miss (6/25)"
      observed_behavior: >
        Participants split into two camps:
        (1) CRITICAL + escalate — over-escalate because "ventilator Telnet = patient safety"
        (2) MEDIUM + investigate — under-react because "legacy Telnet might be config issue"
        Almost none chose the correct path: HIGH + isolate_contact_biomed.
      root_cause: >
        The DO NOT clinical constraint ("DO NOT isolate ventilator during active patient use")
        is being misread as "do not take any hardware action." Participants interpret the
        constraint as a full blocker rather than understanding that network-layer isolation
        (blocking Telnet port, not powering off device) is still safe. Additionally,
        the 'contact biomed' escalation path is not prominent enough in Layer 3.
      improvement_recommendation: >
        Clarify the distinction between network isolation and device power-off in Layer 3.
        Example: "Apply network isolation (block Telnet port 23 at switch level) —
        this does NOT affect ventilator operation which uses a separate clinical network path.
        Immediately contact Biomed Engineering to confirm whether this is a legacy config or breach."
        The DO NOT constraint must specify exactly what is prohibited, not be a general warning.

    - alert_id: 2
      alert_type: "iomt_behavioral_deviation"
      ground_truth_severity: "MEDIUM"
      ground_truth_action: "verify_biomed_rate_limit"
      group_b_accuracy: 0.40
      group_a_accuracy: 0.20
      delta: 0.20
      failure_pattern: "sev_wrong_act_right (5/25) + both_wrong_near_miss (8/25)"
      observed_behavior: >
        Participants correctly escalated in many cases but could not confidently
        assign MEDIUM severity — DNS volume anomaly felt either more or less urgent
        than the ground truth.
      root_cause: >
        DNS query volume anomaly is inherently ambiguous without explicit baseline
        comparison. MVE states the anomaly but doesn't ground the participant's
        intuition about what MEDIUM means operationally for this device type.
      improvement_recommendation: >
        Layer 2 should include a concrete baseline reference:
        "Normal for this device class: 10–15 DNS queries/minute. Current: 300+ queries/minute.
        This rate is consistent with firmware update loops or C2 beaconing — both warrant
        investigation before escalation." This grounds the MEDIUM classification in
        observable evidence rather than abstract threat level.

  regression_alert:  # Group B WORSE than Group A

    - alert_id: 15
      alert_type: "data_exfiltration"
      ground_truth_severity: "LOW"
      ground_truth_action: "verify_schedule_monitor"
      group_b_accuracy: 0.52
      group_a_accuracy: 0.72
      delta: -0.20
      failure_pattern: "sev_wrong_act_right (8/25) — chose MEDIUM + monitor instead of LOW"
      observed_behavior: >
        Group A correctly identified this as a scheduled internal backup (LOW).
        Group B over-elevated to MEDIUM because MVE description of the off-hours
        timing made the transfer seem more suspicious. Reasoning: "Internal EHR
        backup at unusual time may impact operations but likely benign."
      root_cause: >
        MVE Layer 1 accurately describes the off-hours transfer but the framing
        ("unusual time") introduces doubt that wasn't present in the raw alert.
        Group A saw a simple internal SMB transfer and correctly classified it;
        Group B saw MVE language about timing anomaly and overcorrected.
      improvement_recommendation: >
        For LOW-severity alerts, Layer 1 should lead with the benign explanation
        if one is available: "This transfer matches the backup job pattern for
        this system (internal destination, SMB protocol, similar volume to previous
        Tuesdays)." Reserve anomaly framing for genuinely suspicious signals.
        The confidence indicator should read: "Confidence: LOW — pattern consistent
        with scheduled backup; no action required unless destination changes."


# ================================================================
# DIRECTION 2: FAILURE MODES
# ================================================================

failure_mode_analysis:

  group_a:
    n: 500
    correct: 176
    correct_pct: 35.2
    under_reaction: 61
    under_reaction_pct: 12.2
    over_reaction: 41
    over_reaction_pct: 8.2
    sev_wrong_act_right: 69
    sev_wrong_act_right_pct: 13.8
    sev_right_act_wrong: 43
    sev_right_act_wrong_pct: 8.6
    both_wrong_near_miss: 110
    both_wrong_near_miss_pct: 22.0

  group_b:
    n: 500
    correct: 283
    correct_pct: 56.6
    under_reaction: 29
    under_reaction_pct: 5.8
    over_reaction: 5
    over_reaction_pct: 1.0
    sev_wrong_act_right: 53
    sev_wrong_act_right_pct: 10.6
    sev_right_act_wrong: 48
    sev_right_act_wrong_pct: 9.6
    both_wrong_near_miss: 82
    both_wrong_near_miss_pct: 16.4

  key_improvements:
    - metric: "over_reaction"
      group_a: 8.2
      group_b: 1.0
      reduction_pct: 87.8
      interpretation: >
        MVE nearly eliminated over-reaction (false escalation that could disrupt care).
        This is the strongest signal — clinical constraint in Layer 3 is working.

    - metric: "under_reaction"
      group_a: 12.2
      group_b: 5.8
      reduction_pct: 52.5
      interpretation: >
        Under-reaction halved but not eliminated. Remaining cases concentrated in
        iomt_behavioral_deviation (8) and unauthorized_ehr_access (7) —
        both require better role/baseline context in MVE.

  remaining_concerns:
    - concern: "sev_right_act_wrong persists (9.6% in Group B)"
      detail: >
        48 cases where participant correctly assessed severity but chose wrong action.
        This indicates Layer 3 action recommendations are not specific enough for
        certain alert types — particularly endpoint vs network-level responses.
      affects_alerts: [8, 15, 16, 18]

    - concern: "both_wrong_near_miss still 16.4% in Group B"
      detail: >
        82 cases where both severity and action were wrong, but neither was extreme.
        These are 'confused middle' responses — participant understood the alert was
        a problem but couldn't calibrate correctly. Concentrated in data_exfiltration
        and unauthorized_ehr_access where context ambiguity is highest.
      affects_alerts: [3, 5, 6, 12, 13]

  over_reaction_remaining_in_b:
    total: 5
    by_type:
      iomt_behavioral_deviation: 2
      lateral_movement: 2
      data_exfiltration: 1
    interpretation: >
      Only 5 over-reaction cases remain in 500 Group B responses — an excellent result.
      These 5 are edge cases involving ventilator and VLAN boundary alerts where
      clinical threat framing legitimately triggers higher urgency.

  under_reaction_remaining_in_b:
    total: 29
    by_type:
      iomt_behavioral_deviation: 8
      unauthorized_ehr_access: 7
      data_exfiltration: 6
      anomalous_outbound_connection: 5
      lateral_movement: 3
    interpretation: >
      IoMT and EHR access alerts drive most remaining under-reactions.
      IoMT: ambiguous signals (DNS anomaly, legacy protocol) without clear
      device baseline lead to 'wait and see' responses.
      EHR access: role-context ambiguity causes participants to assume legitimacy.


# ================================================================
# DIRECTION 3: REASONING QUALITY
# ================================================================

reasoning_quality_analysis:

  group_comparison:
    metric: "mean values across all 500 responses per group"
    clinical_terms_A: 1.18
    clinical_terms_B: 1.46
    uncertainty_language_A: 0.29
    uncertainty_language_B: 0.14
    blind_following_B: 0.06
    confidence_rating_A: 3.28
    confidence_rating_B: 3.86
    word_count_A: 14.88
    word_count_B: 16.40

  interpretation:
    clinical_grounding: >
      Group B uses more clinical terminology (mean 1.46 vs 1.18 terms/response),
      indicating MVE successfully transfers clinical context vocabulary to participants.
      Examples: "active drug delivery to 8 patients", "EHR gateway", "biomed engineering."
    uncertainty_reduction: >
      Uncertainty language dropped by 52% (0.29 → 0.14). Group A frequently used
      "just in case", "might be", "unsure" — Group B responses are notably more
      decisive. This aligns with the confidence rating increase (3.28 → 3.86).
    blind_following: >
      Blind MVE following is minimal (0.06 mean — essentially none). No participants
      cited "the MVE says" or "Layer 2 indicates" — they internalized context and
      expressed it in their own words. This is a positive signal for ecological validity.

  correct_vs_incorrect_in_group_b:
    b_correct_n: 283
    b_wrong_n: 217
    confidence_rating_correct: 4.15
    confidence_rating_wrong: 3.49
    clinical_terms_correct: 1.56
    clinical_terms_wrong: 1.33
    uncertainty_correct: 0.07
    uncertainty_wrong: 0.24
    interpretation: >
      Incorrect Group B responses show higher residual uncertainty (0.24 vs 0.07)
      and lower clinical term usage (1.33 vs 1.56), suggesting that when MVE
      context transfer fails, participants fall back to uncertainty-driven heuristics
      ("could be", "might be") rather than clinical reasoning.
      This pattern identifies which alert types need richer context: those that
      still produce high uncertainty language despite MVE.

  strongest_reasoning_examples:
    - response_id: "B21"
      alert_id: 1
      reasoning: >
        "Infusion pump doing FTP to an external IP at 2 AM with active drug delivery
        to 8 patients — applying isolate policy immediately while preserving EHR."
      quality_note: "Correctly integrated device type, patient count, protocol, time, and action constraint."

    - response_id: "B23"
      alert_id: 11
      reasoning: >
        "MVE confirms EHR server never initiates outbound connections and scan
        reaching clinical device VLAN is textbook lateral movement from compromised system."
      quality_note: "Used baseline deviation framing from Layer 1 and correctly applied CRITICAL classification."

  weakest_reasoning_examples:
    - response_id: "B01"
      alert_id: 6
      reasoning: "Likely float nurse accessing multiple departments so seems normal enough."
      failure_mode: "both_wrong_near_miss"
      quality_note: >
        Participant reached a plausible innocent explanation and stopped reasoning.
        MVE did not provide enough friction to prompt role-validation check.

    - response_id: "B01"
      alert_id: 18
      reasoning: >
        "Ventilator using Telnet is very unsafe but guidance says not isolate
        so escalating urgently."
      failure_mode: "sev_wrong_act_right"
      quality_note: >
        Participant correctly identified the threat but misread clinical constraint
        as a blocker for all action, defaulting to escalate rather than
        network-layer isolation + biomed contact.


# ================================================================
# PRIORITIZED IMPROVEMENT RECOMMENDATIONS
# ================================================================

improvement_recommendations:

  priority_1_fix_before_paper:
    # These are design gaps that affect paper claims

    - id: "IMP-01"
      affects_alerts: [8, 6]
      alert_type: "unauthorized_ehr_access"
      issue: "Severity ≠ Required Action conflation"
      current_mvE_behavior: >
        LOW severity leads participants to infer 'no action needed.'
        MEDIUM severity with plausible innocent explanation leads to dismissal.
      fix: >
        Add explicit statement in Layer 3 for ALL EHR access alerts regardless of severity:
        "EHR access events always require force re-authentication as a minimum response —
        severity indicates urgency, not whether action is needed."
        Separate the 'urgency' signal (severity) from the 'action required' signal (always reauth).
      paper_implication: >
        Claim C3 (clinical-constraint-aware response) needs to address the
        severity-action conflation as a known limitation. Current M3/M4 metrics
        test for presence of action, not for the severity-action relationship.

    - id: "IMP-02"
      affects_alerts: [6]
      alert_type: "unauthorized_ehr_access"
      issue: "Role authorization status not surfaced"
      current_mve_behavior: >
        MVE describes access pattern but does not explicitly state whether the
        user's role authorizes multi-department or cross-ward access.
      fix: >
        Layer 1 must include a role_authorization_check field:
        "Role authorization: CONFIRMED / UNCONFIRMED / DENIED (per HR/AD directory)"
        If UNCONFIRMED → Layer 3 always recommends verify_force_reauth, overriding
        innocent-explanation framing.
      paper_implication: >
        Requires asset inventory to include role-based access control (RBAC) data.
        This should be noted as a deployment dependency in the paper's implementation section.

    - id: "IMP-03"
      affects_alerts: [18]
      alert_type: "iomt_behavioral_deviation"
      issue: "Clinical constraint blocks all action (misread)"
      current_mve_behavior: >
        "DO NOT isolate ventilator during active patient use" is interpreted as
        'take no hardware action' rather than 'network isolation is still safe.'
      fix: >
        Rewrite clinical constraint to distinguish action levels:
        "DO NOT power off or physically disconnect ventilator.
        Network-layer action (blocking port 23 at switch) is SAFE and does not
        affect device operation. Contact Biomed Engineering before any physical intervention."
      paper_implication: >
        MVE spec Layer 3 clinical_constraint definition needs to be updated to
        include action_level_clarification as a required sub-element for CRITICAL/HIGH
        IoMT alerts.

    - id: "IMP-04"
      affects_alerts: [15]
      alert_type: "data_exfiltration"
      issue: "Anomaly framing triggers over-elevation on benign alerts"
      current_mve_behavior: >
        Off-hours framing in Layer 1 causes Group B to elevate LOW to MEDIUM
        even when destination is internal and pattern matches scheduled backup.
      fix: >
        For LOW-confidence, LOW-severity alerts: lead Layer 1 with the benign
        hypothesis if evidence supports it. Reserve anomaly framing for cases
        where destination is external, unknown, or unwhitelisted.
        Example: "Transfer matches backup job pattern (internal destination,
        similar volume to prior Tuesdays). Flagged due to off-hours timing only."
      paper_implication: >
        Confidence indicator wording matters for calibration. Consider adding
        a 'likely_benign' flag to Layer 1 output schema for alerts with
        confidence: LOW and matching known-safe patterns.

  priority_2_strengthen_paper:
    # These improve claims and discussion sections

    - id: "IMP-05"
      affects_alerts: [2, 19]
      alert_type: "iomt_behavioral_deviation"
      issue: "Baseline quantification insufficient for MEDIUM severity calibration"
      fix: >
        Layer 1 deviation_description should include numeric baseline comparison:
        "Normal: X queries/min. Observed: Y queries/min (Nx above baseline)."
        This anchors the MEDIUM classification in observable evidence.

    - id: "IMP-06"
      affects_alerts: [16]
      alert_type: "data_exfiltration"
      issue: "Partial block vs full isolation ambiguity in Layer 3"
      fix: >
        Layer 3 immediate_action for data_exfiltration must specify:
        (a) exact scope of block (destination IP only, not full endpoint),
        (b) what is explicitly preserved (approved partner connections),
        (c) why partial block is preferred (care continuity).

  priority_3_future_work:
    # Not fixable at prototype stage — mention in limitations

    - id: "IMP-07"
      issue: "unauthorized_ehr_access requires RBAC integration"
      detail: >
        Alerts 6 and 8 cannot be correctly triaged without real-time role
        authorization data from Active Directory / HR systems. This is a
        deployment dependency, not a prototype limitation.
      paper_section: "Implementation dependencies / Limitations"

    - id: "IMP-08"
      issue: "Simulation study uses single AI model (claude-sonnet-4-6)"
      detail: >
        All 50 participants are the same model, which limits ecological validity.
        Real IT generalists bring diverse backgrounds, biases, and heuristics
        that a single model cannot capture. Phase 2 human study is required
        to validate M5 findings.
      paper_section: "Limitations / Future Work"


# ================================================================
# SUMMARY FOR PAPER
# ================================================================

paper_summary:
  key_finding_1: >
    MVE nearly eliminated over-reaction errors (8.2% → 1.0%, 87.8% reduction),
    confirming that clinical constraint guidance in Layer 3 effectively prevents
    care-disrupting responses.

  key_finding_2: >
    Under-reaction errors halved (12.2% → 5.8%), with remaining cases concentrated
    in unauthorized_ehr_access and iomt_behavioral_deviation — alert types requiring
    role authorization data and numeric baseline context not yet in MVE.

  key_finding_3: >
    Group B reasoning showed no blind-following behavior (0.06 mean citations).
    Participants internalized clinical context and expressed it in their own words,
    supporting ecological validity of the MVE format.

  key_finding_4: >
    Two alerts (6 and 8) represent a design gap where severity-action conflation
    leads to systematic failure: participants correctly read severity as LOW/MEDIUM
    but interpret this as 'no action needed' rather than 'low urgency, still reauth.'
    This pattern is not captured by M3/M4 metrics and requires explicit fix.

  known_limitations:
    - "Simulation uses single AI model — human study required for full validation (Phase 2)"
    - "unauthorized_ehr_access requires RBAC data integration not in current prototype"
    - "Network vs physical isolation distinction not explicit in current Layer 3 spec"
    - "LOW-severity framing can inadvertently elevate benign alerts (alert_15 regression)"
