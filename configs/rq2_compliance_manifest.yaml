# RQ2 Compliance Manifest — literature requirement ↔ MVE implementation map
# (RQ2_Compliance.md Phase 4).
#
# This is the single source of truth for the formal-explainability
# requirements that MVE claims to satisfy.  ``make_rq2_compliance_table.py``
# renders this into ``results/rq2_compliance_mapping.md`` (paper appendix)
# and ``results/rq2_compliance_audit.json`` (CI-gated evidence-file audit).
#
# Schema:
#   evidence_files   — REQUIRED, must exist on disk (test fails otherwise)
#   evidence_pending — OPTIONAL, may not yet exist (reported as INFO)
#
# Reviewed annually by Privacy Officer + CISO; bumped whenever a
# requirement is added or evidence moves.

schema_version: "1.0"
last_validated: "2026-05-19"

requirements:
  - id: REQ-FAITHFULNESS
    literature_term: Faithfulness
    description: >
      Explanations must reflect the actual decision logic of the
      underlying model — not post-hoc plausible-sounding text.  For
      MVE, Layer 1 must reference SHAP top-3 features (raw names or
      their human-readable mappings).
    mve_implementation: >
      Invariant 5: Layer 1 references SHAP top-3 features.  Verified
      end-to-end by tests/test_step12_mve_faithfulness.py.
    evidence_files:
      - tests/test_step12_mve_faithfulness.py
      - results/rq2_mve_shap_alignment.json
    evidence_pending:
      - analysis/compute_mve_shap_alignment.py    # RQ2 Track 1, future

  - id: REQ-STABILITY
    literature_term: Stability
    description: >
      Explanations should not change drastically under small input
      perturbations.  Operationalised as SHAP top-k overlap under a
      small additive perturbation.
    mve_implementation: >
      SHAP stability score reported in results/rq2_shap_stability.json
      and gated by tests/test_step11_shap_stability.py.
    evidence_files:
      - tests/test_step11_shap_stability.py
      - results/rq2_shap_stability.json
    evidence_pending:
      - analysis/compute_shap_stability.py        # RQ2 Track 1, future

  - id: REQ-COMPLETENESS
    literature_term: Completeness
    description: >
      Explanations should cover the why, the impact, and the
      recommended action — not just one of these.
    mve_implementation: >
      Three-layer structure enforced by MVEOutput dataclass
      (layer_1 WHY, layer_2 CLINICAL SEVERITY, layer_3 RECOMMENDED
      ACTION + DO NOT).  Coverage verified by
      tests/test_coverage_mve.py.
    evidence_files:
      - src/mve_generator.py
      - src/data_models.py
      - tests/test_coverage_mve.py

  - id: REQ-BREVITY
    literature_term: Brevity
    description: >
      Explanations must be concise enough for time-pressured triage
      decisions (60-second nurse glance, 90-second IT first read).
    mve_implementation: >
      Per-layer word budgets (Layer 1 ≤60, Layer 2 ≤50, Layer 3 ≤60)
      and total ≤150, enforced by the MVEOutput contract and audited
      by analysis/audit_word_budgets.py over the full surfaced-alert
      corpus.
    evidence_files:
      - analysis/audit_word_budgets.py
      - results/rq2_word_budget_audit.json
      - tests/test_word_budgets.py
      - src/data_models.py

  - id: REQ-AUDIENCE_APPROPRIATENESS
    literature_term: Audience appropriateness
    description: >
      The same alert must be communicated differently to different
      stakeholders (IT generalist, biomed engineer, nurse manager)
      while preserving shared facts (anchor, severity).
    mve_implementation: >
      Role views derived via derive_role_view.  Invariant 6 (Layer 2
      severity identical across roles), Invariant 7 (DO NOT preserved
      on clinical alerts), Invariant 9 (shared anchor identical), plus
      a positive role-differentiation assertion in
      test_step13_cross_role_consistency.py.
    evidence_files:
      - src/mve_generator.py
      - tests/test_step13_cross_role_consistency.py
      - tests/test_safe_failure.py
      - configs/role_action_authorization.yaml

  - id: REQ-PROVENANCE
    literature_term: Provenance
    description: >
      For LLM-generated explanations, the prompt, model version, and
      response must be auditable for reproducibility and accountability.
    mve_implementation: >
      MVEOutput carries mode_used, llm_provider, llm_model_version,
      llm_full_prompt, llm_full_response (populated only when Mode A
      runs).  The Module 5 batch sidecar
      (results/reports/mve_outputs.meta.json) fingerprints the corpus
      with SHA-256 of inputs.  When OPENAI_API_KEY is configured, a
      per-call audit log accumulates at logs/llm_audit.jsonl (the
      historical scan in test_phi_not_in_llm_prompt.py reads it).
    evidence_files:
      - src/data_models.py
      - src/mve_generator.py
      - tests/test_phi_not_in_llm_prompt.py
      - results/reports/mve_outputs.meta.json
    evidence_pending:
      - logs/llm_audit.jsonl                      # accrues once Mode A runs

  - id: REQ-FALLBACK
    literature_term: Fallback / availability
    description: >
      The explanation system must degrade gracefully when external
      dependencies fail (e.g. LLM API unavailable, openai package
      absent, no API key configured).
    mve_implementation: >
      Mode A returns None on any failure (missing key, missing
      package, API error, PHI red flag), and generate_mve falls back
      to the deterministic Mode B rule-based path.  Verified by
      test_mode_b_makes_no_external_calls (Phase 1) and the
      Mode B-only corpus produced by the current Module 5 batch.
    evidence_files:
      - src/mve_generator.py
      - tests/test_safe_failure.py
      - tests/test_phi_not_in_llm_prompt.py

  - id: REQ-PHI_CONTROL
    literature_term: Data minimization / HIPAA boundary
    description: >
      For deployments with patient context, no PHI may cross to
      external LLM providers; the data-flow contract must be
      auditable and tested with hard-fail CI gates.
    mve_implementation: >
      configs/llm_data_flow.yaml defines the strict allow-list
      (default-deny) and the forbidden field list with hard-fail
      semantics in _filter_for_llm.  Three layers of test coverage:
      static schema, live PHI honeypot, historical audit-log scan.
    evidence_files:
      - configs/llm_data_flow.yaml
      - src/mve_generator.py
      - tests/test_phi_not_in_llm_prompt.py

review:
  reviewers: ["Privacy Officer", "CISO"]
  review_period: "annually + on schema change"
  last_reviewed: "2026-05-19"
