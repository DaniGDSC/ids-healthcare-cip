# Per-device Track A surfacing thresholds (Layer 1 v4.0 — R2).
#
# These are absolute thresholds on the F2-tuned P(attack) scale. They are
# the operational source of truth for the Track A surfacing gate (Module 2).
#
# Source of truth: src/risk_scorer.py — the values here MUST match the
# _TRACK_A_SURFACING_BY_DEVICE table in risk_scorer.py. The parity test
# tests/test_per_class_thresholds_parity.py enforces this.
#
# Rationale:
#   life-sustaining (infusion_pump, ventilator) → 0.03 (high sensitivity,
#       a missed alert can harm a patient)
#   active monitoring (patient_monitor, monitor) → 0.05 (F2-tuned baseline)
#   imaging                                      → 0.07 (clinical-support,
#       not time-critical)
#   ehr_workstation                              → 0.10 (PHI but not life-
#       critical; raise floor to suppress noise)
#   unknown / unrecognised device_class          → 0.05 (default baseline)

version: "v4.0"
source_of_truth: src/risk_scorer.py::_TRACK_A_SURFACING_BY_DEVICE

per_device_thresholds:
  infusion_pump:   0.03
  ventilator:      0.03
  patient_monitor: 0.05
  monitor:         0.05
  imaging:         0.07
  ehr_workstation: 0.10

unknown_fallback: 0.05
