dae_separation_test:
  architecture: "cascaded — DAE input = [25 raw features || 3 Track A OOF probabilities]"
  encoding_dims: [28, 18, 28]
  noise_rate: 0.1
  n_normal: 4282
  n_anomalous: 614
  normal_error_mean: 0.0000062248
  normal_error_std: 0.0000338987
  anomalous_error_mean: 0.0002106082
  anomalous_error_std: 0.0003373952
  separation_ratio: 33.8338
  auroc: 0.9374
  threshold_95th_percentile: 0.0000171958
  detection_rate_at_threshold: 0.8534
  result: "PASS"
  notes: "Cascaded architecture (Track A output feeds Track B input) resolves the original FAIL. All three sub-tests PASS: separation ratio 33.8x (≥2.0), AUROC 0.9374 (≥0.85), detection rate 85.3% (≥0.70)."
  per_category:
    spoofing:
      n: 337
      auroc: 0.8964
      detection_rate_at_95th: 0.7329
      separation_ratio: 42.8520
      note: "Spoofing AUROC improved from 0.4994 (coin flip) to 0.8964 via cascaded architecture."
    data_alteration:
      n: 277
      auroc: 0.9873
      detection_rate_at_95th: 1.0000
      separation_ratio: 22.8623
      note: "Data Alteration detection preserved at near-perfect levels."
  iomt_device_tests:
    device_class_derivation: "Biometric feature activity patterns (Resp_Rate+SpO2 → ventilator, Pulse_Rate+Heart_rate → patient_monitor, Temp+bio → infusion_pump, low bio → ehr_workstation/other)"
    test_4_detection_by_criticality:
      CRITICAL: {n_attacks: 181, detection_rate: 0.9006, threshold: 0.80, verdict: "PASS"}
      HIGH:     {n_attacks: 150, detection_rate: 0.9067}
      MEDIUM:   {n_attacks: 156, detection_rate: 0.7244}
      LOW:      {n_attacks: 127, detection_rate: 0.8819}
      result: "PASS — CRITICAL detection rate 90.1% exceeds 80% threshold"
    test_5_fpr_by_criticality:
      CRITICAL: {n_normal: 1116, fpr: 0.0582, threshold: 0.15, verdict: "PASS"}
      HIGH:     {n_normal: 818,  fpr: 0.0477, threshold: 0.10, verdict: "PASS"}
      MEDIUM:   {n_normal: 1337, fpr: 0.0583, threshold: 0.10, verdict: "PASS"}
      LOW:      {n_normal: 1011, fpr: 0.0326, threshold: 0.05, verdict: "PASS"}
      result: "PASS — all criticality levels within FPR thresholds"
    per_device_class:
      ventilator:       {criticality: CRITICAL, n_attacks: 106, detection_rate: 0.8868, n_normal: 609,  fpr: 0.0493}
      infusion_pump:    {criticality: CRITICAL, n_attacks: 75,  detection_rate: 0.9200, n_normal: 507,  fpr: 0.0690}
      patient_monitor:  {criticality: HIGH,     n_attacks: 150, detection_rate: 0.9067, n_normal: 818,  fpr: 0.0477}
      ehr_workstation:  {criticality: MEDIUM,   n_attacks: 153, detection_rate: 0.7190, n_normal: 1331, fpr: 0.0571}
      other:            {criticality: LOW,      n_attacks: 127, detection_rate: 0.8819, n_normal: 1011, fpr: 0.0326}
    notes: >
      Life-sustaining devices (ventilators 88.7%, infusion pumps 92.0%) exceed the
      80% CRITICAL detection threshold. Infusion pumps show the highest detection rate
      of any device class. EHR workstations are the weakest at 71.9% — these are primarily
      Spoofing attacks where Track A signal is weaker, but still above the 70% minimum.

  prior_result:
    architecture: "independent — DAE input = 25 raw features only"
    auroc: 0.7143
    detection_rate: 0.3958
    result: "FAIL"
    spoofing_auroc: 0.4994
    root_cause: "Spoofing attacks invisible to reconstruction error on raw features alone"

  root_cause_analysis:
    summary: >
      Spoofing attacks (337/614 anomalous, 55%) produce reconstruction error 0.30x
      that of normal traffic (AUROC 0.4994 — coin flip), while Data Alteration attacks
      (277/614, 45%) produce 21.8x error (AUROC 0.9758). The combined 0.7143 AUROC is
      a Simpson's paradox driven by mixing two attack classes with opposite DAE signatures.

    primary_cause: "feature_weight_mismatch"
    detail: >
      The DAE concentrates 95.8% of its reconstruction weight on 5 packet-loss/size
      features (pSrcLoss, SIntPktAct, sMaxPktSz, pDstLoss, SrcBytes). These features
      have AUROC 0.499-0.500 for spoofing vs normal — zero discriminative power.
      The features that carry spoofing signal (Sport, Temp, Pulse_Rate, DIntPkt, Flgs)
      receive 0.32% of total DAE weight. XGBoost uses exactly these features (SHAP +3.87
      to +4.25 for detected spoofing) to achieve 88.7% spoofing recall.

    per_category_metrics:
      data_alteration:
        n: 277
        detection_rate_at_95th: 0.8664
        auroc: 0.9758
        separation_ratio: 21.8419
        verdict: "PASS on all three tests"
      spoofing:
        n: 337
        detection_rate_at_95th: 0.0089
        auroc: 0.4994
        separation_ratio: 0.30
        verdict: "Undetectable — reconstructs more cleanly than normal traffic"

    why_spoofing_is_invisible: >
      Spoofing generates structurally regular network flows (zero payload bytes,
      near-identical load values, low packet-loss) that the DAE reconstructs with
      ease. The benign-only training objective learned to minimize reconstruction
      error on exactly these regular patterns. Spoofing's anomaly is semantic
      (wrong source identity, credential mismatch) not statistical, and does not
      manifest as elevated reconstruction error in any available feature.

    failed_mitigations_tested:
      - name: "equal_weight_reconstruction"
        auroc_spoofing: 0.4749
        verdict: "No improvement — per-feature errors themselves are non-discriminative"
      - name: "biometric_only_error"
        auroc_spoofing: 0.4979
        verdict: "Biometric errors equally low for spoofing and normal"
      - name: "error_profile_cosine_distance"
        auroc_spoofing: 0.4986
        verdict: "Error shape is identical between spoofing and normal"
      - name: "bio_to_pkt_error_ratio"
        auroc_spoofing: 0.4913
        verdict: "No cross-domain signal in error ratios"

    ensemble_interaction:
      xgb_spoofing_recall: 0.887
      dae_spoofing_recall: 0.009
      dae_fp_correction_value: "89% of XGBoost FPs have low DAE error (correctable)"
      dae_tp_suppression_risk: "58% of XGBoost TPs have low DAE error (would be suppressed)"
      conclusion: >
        DAE adds value as a FP filter for Data Alteration alerts only. Using it as a
        general-purpose veto on supervised model detections would suppress 58% of true
        positives, almost entirely spoofing attacks.

  fix_implemented:
    name: "Cascaded architecture — Track A normal output feeds Track B input"
    status: "IMPLEMENTED AND VALIDATED"
    description: >
      Restructured the pipeline from independent parallel tracks to a cascade:
      DAE (Track B) trains on [25 raw features || 3 Track A OOF probabilities].
      At inference, Track A runs first, then its probabilities are concatenated
      with raw features before the DAE forward pass. The DAE learns what "normal"
      looks like in the joint feature-prediction space. Spoofing attacks that are
      invisible in raw features become detectable because Track A's elevated
      probabilities (benign mean [0.01, 0.09, 0.06] vs spoofing [0.82, 0.59, 0.67])
      are far outside the DAE's benign training distribution.

    files_changed:
      - "pipeline/module2_detection/module2_train_models.py"
      - "pipeline/module3_risk_scoring/module3_risk_scores.py"
      - "pipeline/module4_explanations/module4_online_explainer.py"

    architecture:
      training:
        step_1: "Track A (XGB, RF, DT) trains on SMOTE-balanced dataset"
        step_2: "OOF probabilities saved (from cross_val_predict, already computed for threshold optimization)"
        step_3: "DAE trains on [X_benign || OOF_probas_benign] — 28 features, [28, 18, 28] architecture"
      inference:
        step_1: "Track A models produce P(attack) per sample"
        step_2: "DAE input = [raw_features || Track_A_probas]"
        step_3: "C_detect = max(Track_A, Track_B) — DAE elevates, never suppresses"

    before_vs_after:
      combined_auroc: {before: 0.7143, after: 0.9374}
      spoofing_auroc: {before: 0.4994, after: 0.8964}
      data_alteration_auroc: {before: 0.9758, after: 0.9873}
      detection_rate_at_95th: {before: 0.3958, after: 0.8534}
      separation_ratio: {before: 10.0193, after: 33.8338}
      dae_separation_test: {before: "FAIL", after: "PASS"}

    rejected_alternatives:
      uniform_weights: "AUROC 0.68 — worse than original"
      interaction_features: "Spoofing AUROC 0.4953 — no improvement, degraded Data Alteration"
      scoped_fusion_only: "Preserved detection but did not fix spoofing blindness — incomplete"

    prototype_regression_test:
      all_automated_tests: "8/8 PASS"
      all_negative_tests: "6/6 PASS (0 violations)"
      recommendation: "SHIP_TO_USER_STUDY"

